<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หมูหมาแมว - เกมพูดตาม</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap');
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
            height: 100vh; color: #333; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 15px; position: relative; }
        #backToMenu {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.4);
            padding: 8px 20px; border: none; border-radius: 50px; color: #333; font-weight: 600;
            font-size: 1rem; cursor: pointer; backdrop-filter: blur(12px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s;
        }
        #backToMenu:hover { background: rgba(255,255,255,0.6); }
        #levelSelect { text-align: center; }
        h1 { font-size: 3.2rem; margin: 0 0 10px; text-shadow: 0 4px 15px rgba(0,0,0,0.2); color: #d32f2f; }
        .subtitle { font-size: 1.4rem; margin-bottom: 20px; opacity: 0.9; color: #444; }
        .friendly-msg {
            font-size: 1.6rem; font-weight: 700;
            color: #e91e63; margin: 20px 0 40px;
            text-shadow: 0 2px 8px rgba(233,30,99,0.3);
        }
        .start-btn {
            width: 80%; max-width: 340px; padding: 24px; font-size: 2.2rem; font-weight: 900;
            border: none; border-radius: 50px; cursor: pointer;
            background: #ffca28; color: #d50000;
            box-shadow: 0 14px 35px rgba(0,0,0,0.25); transition: all 0.3s;
        }
        .start-btn:hover { transform: translateY(-10px) scale(1.06); background: #ffd54f; }

        #game { display: none; text-align: center; position: relative; }
        .question-heading {
            font-size: 2.3rem; font-weight: 900; margin: 30px 20px 20px;
            padding: 18px; background: rgba(255,255,255,0.55);
            border-radius: 28px; backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); color: #c2185b;
        }
        .typing-display {
            font-size: 4.2rem; font-weight: bold; min-height: 110px;
            margin: 30px 20px; 
            background: rgba(255,255,255,0.55); padding: 28px; border-radius: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: color 0.4s ease, background 0.4s ease;
        }
        .typing-display.correct {
            color: #2e7d32;
            background: rgba(200, 230, 201, 0.75);
        }
        .typing-display.incorrect {
            color: #c62828;
            background: rgba(255, 205, 210, 0.75);
        }

        #lives {
            font-size: 1.8rem;
            margin: 8px 0 16px; 
            color: #d32f2f;
            font-weight: 900; text-shadow: 0 2px 6px rgba(211,47,47,0.4);
        }

        #speakCue {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            font-size: 3.8rem; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; text-shadow: 0 0 18px #ffca28;
            z-index: 5;
        }
        #speakCue.show { opacity: 1; }

        #voiceInputBtn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 24px; font-size: 1.4rem;
            background: #4CAF50; color: white;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25); transition: all 0.3s;
        }
        #voiceInputBtn:hover { background: #43A047; transform: translate(-50%, -6px); }

        #success-celebration, #fail-celebration {
            position: absolute; inset: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 7rem; opacity: 0; transform: scale(0.5);
            transition: all 0.7s ease-out; z-index: 10;
        }
        #success-celebration.show { opacity: 0.95; transform: scale(1.5) rotate(12deg); }
        #fail-celebration { color: #e74c3c; font-size: 8rem; }
        #fail-celebration.show { opacity: 0.92; transform: scale(1.4) rotate(-10deg); }

        #result { display: none; text-align: center; }
        #result h2 { font-size: 3.8rem; margin: 30px 0 20px; color: #c2185b; outline: none; }
        #resultMsg { font-size: 2.1rem; line-height: 1.6; margin: 30px 0; color: #444; }
        #score { font-size: 4.8rem; font-weight: 900; margin: 30px 0; color: #e91e63; }
        .btn-restart {
            padding: 18px 70px; font-size: 1.9rem; background: #ffca28; color: #d50000;
            border: none; border-radius: 50px; cursor: pointer; font-weight: 800;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .btn-restart:hover { transform: translateY(-8px); }

        #question-live { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    </style>
</head>
<body>

<div class="container">
    <button id="backToMenu">กลับเมนูหลัก</button>

    <div id="levelSelect">
        <h1>หมูหมาแมว</h1>
        <p class="subtitle">พูดตามให้เป๊ะ! อย่าให้สัตว์งงนะ<br>มีหมา แมว หมู หมี ไก่ กบ แกะและกา</p>
        <p class="friendly-msg">พร้อมพูดตามแล้วรึยัง</p>
        <button class="start-btn" id="startGame">เริ่มเกม</button>
    </div>

    <div id="game">
        <div id="success-celebration">🎉🐶🐱✨</div>
        <div id="fail-celebration">💥😿</div>
        <div id="speakCue">🗣️ พูดเลย!</div>

        <div id="lives">❤️❤️❤️</div>
        <h2 class="question-heading" id="question" tabindex="-1">ข้อ 1 : ...</h2>
        <div class="typing-display" id="typingDisplay">_ _ _ _</div>

        <button id="voiceInputBtn">พูดอีกครั้ง</button>
    </div>

    <div id="question-live" aria-live="polite" aria-atomic="true"></div>

    <div id="result" aria-hidden="true" tabindex="-1">
        <h2 id="resultTitle" tabindex="-1">สุดยอดมาก!</h2>
        <div id="resultMsg"></div>
        <div id="score">0 คะแนน</div>
        <button class="btn-restart" id="restartBtn">เล่นใหม่</button>
    </div>
</div>

<script>
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.isUnlocked = false;
    this.bgmSource = null;
    this.bgmGain = null;
    this.buffers = {};
    this.sounds = {
      correctSound: "https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-reward-952.mp3",
      wrongSound: "https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-946.mp3",
      bgm: "audio/b3.mp3",
      doorSound: "audio/door.mp3",
      t1Sound: "audio/t1.mp3",
      tSound: "audio/t.mp3",
      t2Sound: "audio/t2.mp3",
      fSound: "audio/f.mp3",
      f1Sound: "audio/f1.mp3",
      f2Sound: "audio/f2.mp3",
      endSound: "audio/end.mp3",
      end1Sound: "audio/end1.mp3",
      speak: "audio/speak.mp3"
    };
  }

  async initContext() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await this.loadAllBuffers();
  }

  async loadAllBuffers() {
    const promises = Object.entries(this.sounds).map(async ([key, url]) => {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        this.buffers[key] = await this.ctx.decodeAudioData(arrayBuffer);
      } catch (e) { console.warn(`Failed to load sound: ${key}`, e); }
    });
    await Promise.all(promises);
  }

  async unlockAll() {
    if (this.isUnlocked) return;
    await this.initContext();
    const source = this.ctx.createBufferSource();
    source.buffer = this.ctx.createBuffer(1,1,22050);
    source.connect(this.ctx.destination);
    source.start(0);
    this.isUnlocked = true;
  }

  async startBGM() {
    if (!this.buffers.bgm || this.bgmSource) return;
    await this.unlockAll();
    this.bgmSource = this.ctx.createBufferSource();
    this.bgmSource.buffer = this.buffers.bgm;
    this.bgmSource.loop = true;
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.55;
    this.bgmSource.connect(this.bgmGain);
    this.bgmGain.connect(this.ctx.destination);
    this.bgmSource.start(0);
  }

  stopBGM() {
    if (this.bgmSource) {
      this.bgmSource.stop();
      this.bgmSource = null;
    }
  }

  playEffect(key) {
    if (!this.buffers[key]) return Promise.resolve();
    return (async () => {
      await this.unlockAll();
      const source = this.ctx.createBufferSource();
      source.buffer = this.buffers[key];
      const gainNode = this.ctx.createGain();
      gainNode.gain.value = 0.8;
      source.connect(gainNode);
      gainNode.connect(this.ctx.destination);
      return new Promise(resolve => {
        source.onended = () => resolve();
        source.start(0);
      });
    })();
  }
}

const audioEngine = new AudioEngine();

const syllables = ["ไก่","กา","แกะ","กบ","หมู","หมา","แมว","หมี"];
let currentQuestion = "";
let currentRound = 0;
let lives = 3;
let score = 0;
let recognition = null;
let isListening = false;
let roundTimer = null;
const TIME_LIMIT = 7;

const elements = {
  backBtn: document.getElementById('backToMenu'),
  levelSelect: document.getElementById('levelSelect'),
  gameDiv: document.getElementById('game'),
  resultDiv: document.getElementById('result'),
  questionElem: document.getElementById('question'),
  typingDisplay: document.getElementById('typingDisplay'),
  livesElem: document.getElementById('lives'),
  questionLive: document.getElementById('question-live'),
  successCeleb: document.getElementById('success-celebration'),
  failCeleb: document.getElementById('fail-celebration'),
  speakCue: document.getElementById('speakCue')
};

function randomNoAdjacentRepeat(length) {
  let result = [syllables[Math.floor(Math.random()*syllables.length)]];
  while (result.length < length) {
    let candidate = syllables[Math.floor(Math.random()*syllables.length)];
    if (candidate !== result[result.length-1]) result.push(candidate);
  }
  return result.join("");
}

function getPointsForRound(round) {
  if (round <= 3) return 100;
  if (round <= 6) return 200;
  if (round <= 9) return 400;
  if (round <= 12) return 800;
  if (round <= 15) return 1600;
  return 3200;
}

function getLengthForRound(round) {
  if (round <= 3) return 4;
  if (round <= 6) return 5;
  if (round <= 9) return 6;
  if (round <= 12) return 7;
  if (round <= 15) return 8;
  return 10;
}

function updateLivesDisplay() {
  elements.livesElem.textContent = "❤️".repeat(lives) + "♡".repeat(3-lives);
}

function clearTimer() {
  if (roundTimer) { clearTimeout(roundTimer); roundTimer = null; }
}

function startTimer() {
  clearTimer();
  roundTimer = setTimeout(() => {
    if (isListening) recognition.stop();
    elements.typingDisplay.textContent = "(หมดเวลา)";
    elements.typingDisplay.classList.add('incorrect');
    handleWrong();
  }, TIME_LIMIT * 1000);
}

async function startNewGame() {
  currentRound = 0; lives = 3; score = 0;
  updateLivesDisplay();
  elements.levelSelect.style.display = 'none';
  elements.gameDiv.style.display = 'block';
  elements.resultDiv.style.display = 'none';
  elements.backBtn.style.display = 'none';
  elements.resultDiv.setAttribute('aria-hidden', 'true');
  elements.gameDiv.setAttribute('aria-hidden', 'false');
  await audioEngine.startBGM();
  nextRound();
}

function nextRound() {
  currentRound++;
  const len = getLengthForRound(currentRound);
  currentQuestion = randomNoAdjacentRepeat(len);

  elements.questionElem.textContent = `รอบ ${currentRound} : ${currentQuestion}`;
  elements.typingDisplay.textContent = currentQuestion.split("").map(()=>"_").join(" ");
  elements.typingDisplay.classList.remove('correct','incorrect');

  elements.questionLive.textContent = '';
  setTimeout(() => { elements.questionLive.textContent = elements.questionElem.textContent; }, 5);
  elements.questionElem.focus();

  setTimeout(async () => {
    await audioEngine.playEffect('speak');
    elements.speakCue.classList.add('show');
    setTimeout(() => elements.speakCue.classList.remove('show'), 600);
    startTimer();
    setTimeout(startListening, 300); 
  }, 400); 
}

function startListening() {
  if (!recognition) return;
  try { recognition.start(); } catch(e){}
}

function initSpeechRecognition() {
  if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) return;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'th-TH';
  recognition.interimResults = false;
  recognition.onstart = () => { isListening = true; };
  recognition.onend = () => { isListening = false; };

  recognition.onresult = async (event) => {
    isListening = false;
    clearTimer();
    let transcript = event.results[0][0].transcript || "";
    let cleaned = transcript.replace(/[^\u0E00-\u0E7F]/g, '').trim();

    if (cleaned === currentQuestion) {
      elements.typingDisplay.textContent = cleaned;
      elements.typingDisplay.classList.add('correct');
      elements.successCeleb.classList.add('show');
      setTimeout(() => elements.successCeleb.classList.remove('show'), 800);
      
      await audioEngine.playEffect('correctSound');
      await audioEngine.playEffect('tSound');

      score += getPointsForRound(currentRound);
      if (currentRound >= 20) {
        await endGame(true);
      } else {
        setTimeout(nextRound, 700); 
      }
    } else {
      elements.typingDisplay.textContent = cleaned || "(ไม่ได้ยิน)";
      elements.typingDisplay.classList.add('incorrect');
      await handleWrong();
    }
  };

  recognition.onerror = async () => {
    isListening = false; clearTimer();
    elements.typingDisplay.textContent = "(ตรวจจับไม่ได้)";
    elements.typingDisplay.classList.add('incorrect');
    await handleWrong();
  };
}

async function handleWrong() {
  clearTimer();
  
  // เก็บจำนวนชีวิตเดิมไว้เพื่อเลือกเสียง
  const previousLives = lives;
  lives--;
  updateLivesDisplay();
  
  elements.failCeleb.classList.add('show');
  setTimeout(() => elements.failCeleb.classList.remove('show'), 800);

  await audioEngine.playEffect('wrongSound');
  
  // เลือกเล่นไฟล์เสียงตามลำดับการตอบผิด
  if (previousLives === 3) {
    await audioEngine.playEffect('fSound'); // ผิดครั้งที่ 1
  } else if (previousLives === 2) {
    await audioEngine.playEffect('f1Sound'); // ผิดครั้งที่ 2
  } else if (previousLives === 1) {
    await audioEngine.playEffect('f2Sound'); // ผิดครั้งที่ 3 (ชีวิตหมดพอดี)
  }

  if (lives <= 0 || currentRound >= 20) {
    await endGame(false);
  } else {
    setTimeout(nextRound, 700); 
  }
}

async function endGame(isWin) {
  elements.typingDisplay.textContent = "";
  elements.questionLive.textContent = "";
  clearTimer();
  audioEngine.stopBGM();

  elements.gameDiv.style.display = 'none';
  elements.resultDiv.style.display = 'block';
  elements.backBtn.style.display = 'block';
  elements.gameDiv.setAttribute('aria-hidden', 'true');
  elements.resultDiv.setAttribute('aria-hidden', 'false');

  const title = document.getElementById('resultTitle');
  const msg = document.getElementById('resultMsg');
  document.getElementById('score').textContent = score + " คะแนน";

  if (isWin) {
    title.textContent = "เซียนหมูหมาแมวตัวจริง!";
    msg.innerHTML = "สุดยอดมาก! ผ่าน 20 รอบแบบเป๊ะ ๆ เลยนะ 🐶🐱🐷✨<br>เป็นตำนานแห่งการพูดตามแล้ว!";
    await audioEngine.playEffect('endSound');
  } else if (score >= 20000) {
    title.textContent = "เก่งมากๆ!";
    msg.innerHTML = "ผ่านมาจนเกือบสุดทางแล้วนะ<br>คะแนนสูงขนาดนี้ เกือบเป็นเซียนแล้ว! 💪🏾";
    await audioEngine.playEffect('endSound');
  } else if (score >= 8000) {
    title.textContent = "เยี่ยมเลย!";
    msg.innerHTML = `ได้ ${score} คะแนน แบบนี้ต้องภูมิใจมาก ๆ เลยนะ 🐶❤️`;
    await audioEngine.playEffect('endSound');
  } else {
    title.textContent = "อย่าเพิ่งท้อ!";
    msg.innerHTML = "สนุกใช่ไหมล่ะ มาใหม่กันอีกนะ ครั้งหน้าต้องเป๊ะกว่านี้แน่ 🐱💕";
    await audioEngine.playEffect('end1Sound');
  }
  setTimeout(() => { title.focus(); }, 200);
}

document.addEventListener('DOMContentLoaded', () => {
  initSpeechRecognition();
  document.getElementById('startGame').onclick = startNewGame;
  document.getElementById('restartBtn').onclick = async () => {
    await audioEngine.playEffect('doorSound');
    startNewGame();
  };
  document.getElementById('backToMenu').onclick = async () => {
    audioEngine.stopBGM();
    await audioEngine.playEffect('doorSound');
    location.href = '../index.html';
  };
  document.getElementById('voiceInputBtn').onclick = () => {
    if (recognition && !isListening) startListening();
  };
});

const unlock = async () => { await audioEngine.unlockAll(); await audioEngine.startBGM(); };
document.addEventListener("touchstart", unlock, {once:true, passive:true});
document.addEventListener("click", unlock, {once:true});
</script>
</body>
</html>
