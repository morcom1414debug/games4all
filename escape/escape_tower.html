<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Tower — ฝ่าตึกมรณะ</title>
    <link rel="stylesheet" href="escape_tower.css">
    <script src="escape_tower_clues.js" defer></script>
    <script src="escape_tower.js" defer></script>
</head>
<body>
    <div aria-live="polite" id="announcer" class="sr-only"></div>

    <!-- หน้ากรอกชื่อ -->
    <main id="screen-login" class="screen active">
        <h1>Escape Tower — ฝ่าตึกมรณะ</h1>
        <div class="form-group">
            <label for="player-name">ชื่อผู้เล่น:</label>
            <input type="text" id="player-name" maxlength="20" aria-required="true">
        </div>
        <button id="btn-start" type="button">เข้าสู่ล็อบบี้</button>
    </main>

    <!-- หน้าล็อบบี้ -->
    <main id="screen-lobby" class="screen hidden">
        <h2>ล็อบบี้</h2>
        <p>ยินดีต้อนรับ, <span id="display-player-name"></span></p>
        
        <div class="lobby-controls">
            <button id="btn-create-room" type="button">สร้างห้องใหม่</button>
        </div>

        <div id="room-creation" class="hidden room-panel">
            <h3>การตั้งค่าห้อง</h3>
            <p>ผู้เล่น: <span id="count-players">1</span>/4 | บอท: <span id="count-bots">0</span></p>
            <button id="btn-add-bot" type="button">เพิ่มบอท</button>
            <button id="btn-remove-bot" type="button" disabled>ลดบอท</button>
            <button id="btn-start-game" type="button">เริ่มเกม</button>
        </div>

        <h3>รายการห้องที่เข้าร่วมได้ (จำลอง)</h3>
        <ul id="room-list" aria-label="รายการห้อง">
            <li>ยังไม่มีห้องในขณะนี้</li>
        </ul>
    </main>

    <!-- หน้าเกม -->
    <main id="screen-game" class="screen hidden">
        <header>
            <h2>ชั้น <span id="current-floor-display">6</span></h2>
            <h3 id="turn-heading">เทิร์นปัจจุบัน: <span id="turn-indicator" aria-live="assertive">กำลังโหลด...</span></h3>
        </header>

        <!-- พื้นที่แสดงสถานะผู้เล่นปัจจุบัน และปุ่มเปิดหน้าดูสถานะผู้เล่นทุกคน -->
        <section id="local-player-status-container" aria-label="สถานะตัวละครของคุณ">
            <div id="local-player-status-wrapper">
                <div id="local-player-status">
                    <!-- แสดงเฉพาะสถานะตัวละครที่ควบคุมผ่าน JS -->
                </div>
                <button id="btn-view-all-players" type="button" aria-haspopup="dialog" aria-controls="modal-all-players-status">ดูสถานะผู้เล่นทุกคน</button>
            </div>
        </section>

        <!-- โครงสร้างเดิมที่ JS Render ไว้ ให้ยังคงอยู่ ไม่ลบไอดีเดิม -->
        <section id="status-panel" aria-label="สถานะผู้เล่นทั้งหมด" class="hidden">
            <!-- สร้างผ่าน JS -->
        </section>

        <section id="game-board-container" aria-label="กระดานห้อง">
            <div id="game-board">
                <!-- สร้างปุ่มห้อง 20 ปุ่มผ่าน JS -->
            </div>
        </section>

        <!-- โครงสร้างส่วนประตูทางลง -->
        <section id="door-section" aria-label="ส่วนประตูทางลง">
            <button id="btn-main-door" type="button" aria-expanded="false" aria-controls="door-controls">ประตูทางลง</button>
            
            <div id="door-controls" class="hidden" aria-label="แผงควบคุมประตูลงชั้น">
                <h3>ตัวเลือกการเปิดประตู</h3>
                <div class="door-options-group">
                    <button id="btn-use-key" type="button">ไขกุญแจธรรมดา</button>
                    <button id="btn-use-skeleton-key" type="button">ไขกุญแจผี</button>
                    <button id="btn-open-keypad" type="button">ใส่รหัสคำใบ้</button>
                </div>
            </div>
        </section>

        <section id="event-log" aria-live="polite" aria-atomic="false" aria-label="บันทึกเหตุการณ์">
            <!-- บันทึกเหตุการณ์ -->
        </section>
    </main>

    <!-- หน้าต่างดูสถานะผู้เล่นทุกคน (Modal/Dialog) -->
    <dialog id="modal-all-players-status" aria-labelledby="all-players-status-title">
        <div class="modal-header">
            <h2 id="all-players-status-title">สถานะผู้เล่นทุกคน</h2>
            <button id="btn-close-all-players-status" type="button" aria-label="ปิดหน้าสถานะผู้เล่น">ปิด</button>
        </div>
        <div id="all-players-list" aria-label="รายการสถานะผู้เล่นทุกคน">
            <!-- สถานะตัวละครเรียงลงมาจากบนลงล่าง -->
        </div>
    </dialog>

    <!-- หน้าต่างรหัส (Modal) -->
    <dialog id="modal-keypad" aria-labelledby="keypad-title">
        <h2 id="keypad-title">แป้นกดรหัสปลดล็อก</h2>
        <div id="clue-display-area" aria-live="polite"></div>
        <div class="keypad-display">
            <span id="keypad-input" aria-label="รหัสที่กรอก"></span>
        </div>
        <div class="keypad-grid">
            <button class="key-btn" type="button" data-val="1">1</button>
            <button class="key-btn" type="button" data-val="2">2</button>
            <button class="key-btn" type="button" data-val="3">3</button>
            <button class="key-btn" type="button" data-val="4">4</button>
            <button class="key-btn" type="button" data-val="5">5</button>
            <button class="key-btn" type="button" data-val="6">6</button>
            <button class="key-btn" type="button" data-val="7">7</button>
            <button class="key-btn" type="button" data-val="8">8</button>
            <button class="key-btn" type="button" data-val="9">9</button>
            <button id="btn-keypad-clear" type="button">ล้าง</button>
            <button class="key-btn" type="button" data-val="0">0</button>
            <button id="btn-keypad-del" type="button">ลบ</button>
        </div>
        <div class="modal-actions">
            <button id="btn-keypad-submit" type="button">ยืนยันรหัส</button>
            <button id="btn-keypad-cancel" type="button">ยกเลิก</button>
        </div>
    </dialog>
</body>
</html>
