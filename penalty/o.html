function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  return audioCtx;
}

function resumeAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === "suspended") {
    ctx.resume().catch(() => {});
  }
}

function decodeBuffer(ctx, arrayBuffer) {
  // รองรับทั้งแบบ Promise และแบบ callback (Safari รุ่นเก่า)
  return new Promise((resolve, reject) => {
    const p = ctx.decodeAudioData(arrayBuffer, resolve, reject);
    if (p && typeof p.then === "function") p.then(resolve, reject);
  });
}

function loadSoundBuffer(name) {
  const ctx = getAudioCtx();
  if (!ctx || preloadedAudios[name]) return Promise.resolve();
  return fetch(`audio/${name}`)
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.arrayBuffer();
    })
    .then(data => decodeBuffer(ctx, data))
    .then(buffer => {
      preloadedAudios[name] = buffer;
      // ถ้ามีคำสั่งเปิด BGM ค้างไว้ และ b.mp3 เพิ่งโหลดเสร็จ ให้เริ่มเล่นทันที
      if (name === "b.mp3" && bgmWanted && !bgmSource) startBGM();
    })
    .catch(err => {
      console.warn("โหลดเสียงไม่สำเร็จ:", name, err);
    });
}

function preloadAllSounds() {
  // ถูกเรียกหลังผู้ใช้กดปุ่มยืนยันชื่อ (มี user gesture) จึงสร้าง/resume AudioContext ได้
  resumeAudio();
  const files = ["friend.mp3", "b.mp3", "end.mp3"];
  const all = [...files, ...goalSounds, ...missSounds, popSound];
  all.forEach(name => loadSoundBuffer(name));
}

function playSound(name, volume = 1) {
  const ctx = getAudioCtx();
  const buffer = preloadedAudios[name];
  if (!ctx || !buffer) return;
  resumeAudio();
  const source = ctx.createBufferSource();
  const gain = ctx.createGain();
  source.buffer = buffer;
  gain.gain.value = volume;
  source.connect(gain);
  gain.connect(ctx.destination);
  source.start(0);
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (e) {}
  };
}

function startBGM() {
  bgmWanted = true;
  const ctx = getAudioCtx();
  const buffer = preloadedAudios["b.mp3"];
  if (!ctx || !buffer) return;   // ยังโหลดไม่เสร็จ จะเริ่มเองเมื่อโหลดเสร็จ
  resumeAudio();
  if (bgmSource) {
    try { bgmSource.stop(); } catch (e) {}
    try { bgmSource.disconnect(); } catch (e) {}
    bgmSource = null;
  }
  bgmSource = ctx.createBufferSource();
  bgmGain = ctx.createGain();
  bgmSource.buffer = buffer;
  bgmSource.loop = true;
  bgmGain.gain.value = 0.3;
  bgmSource.connect(bgmGain);
  bgmGain.connect(ctx.destination);
  bgmSource.start(0);
}
function stopBGM() {
  bgmWanted = false;
  if (bgmSource) {
    try { bgmSource.stop(); } catch (e) {}
    try { bgmSource.disconnect(); } catch (e) {}
    bgmSource = null;
  }
  if (bgmGain) {
    try { bgmGain.disconnect(); } catch (e) {}
    bgmGain = null;
  }
}

function triggerSound(name) {
  if (!roomId) return;
  db.ref(`penaltyRooms/${roomId}/soundTrigger`).set({
    name: name,
    time: Date.now(),
    playerId: playerId
  });
}

function startSoundListener() {
  if (soundListener) soundListener.off();
  if (!roomId) return;
  soundListener = db.ref(`penaltyRooms/${roomId}/soundTrigger`);
  soundListener.on("value", s => {
    const data = s.val();
    if (!data || Date.now() - data.time > 1000) return;

    const name = data.name;
    playSound(name, 1);

    let msg = "";
    if (goalSounds.includes(name)) msg = "ยิงเข้า!";
    else if (missSounds.includes(name)) msg = "ยิงไม่เข้า!";
    else if (name === "end.mp3") msg = "จบเกม!";
    else if (name === "friend.mp3") msg = `${playerName} เลือกทีมแล้ว`;

    if (msg) {
      speak(msg);
      const live = document.getElementById("tts");
      live.textContent = msg;
      setTimeout(() => live.textContent = "", 3000);
    }
  });
}

let ttsQueue = [];
let isSpeaking = false;
const ttsDisplay = document.getElementById("ttsDisplay");

function speak(text){
  ttsQueue.push(text);
  processTTS();
}
function processTTS(){
  if(isSpeaking || ttsQueue.length === 0) return;
  isSpeaking = true;
  const msg = ttsQueue.shift();
  ttsDisplay.textContent = msg;
  ttsDisplay.classList.add('show');
  setTimeout(()=>{
    document.getElementById("tts").innerText = msg;
    setTimeout(()=>{
      isSpeaking = false;
      document.getElementById("tts").innerText = "";
      ttsDisplay.classList.remove('show');
      processTTS();
    }, Math.max(800, msg.length * 50));
  }, 50);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function createShotsOrder(team){
  let players = squads[team].players.slice();
  shuffle(players);
  players.push(squads[team].keeper);
  return players;
}

function getShooterName(order, shotIndex) {
  const length = order.length;
  if (length === 0) return "นักเตะ";
  return order[shotIndex % length];
}

async function showCreateRoom() {
  const name = prompt("ตั้งชื่อห้อง:");
  if (!name || name.trim() === "") return;

  const roomRef = db.ref("penaltyRooms").push();
  const newRoomId = roomRef.key;

  try {
    await roomRef.set({
      name: name.trim(),
      status: "waiting",
      host: playerId,
      created: Date.now(),
      players: {
        [playerId]: { name: playerName, team: null }
      }
    });

    const playerRef = db.ref(`penaltyRooms/${newRoomId}/players/${playerId}`);
    playerRef.onDisconnect().remove();

    roomId = newRoomId;
    isHost = true;
    showRoom();

    setTimeout(() => {
      const firstTeamBtn = document.querySelector("#teamSelectInRoom button");
      if (firstTeamBtn) firstTeamBtn.focus();
    }, 300);
  } catch (err) {
    console.error("สร้างห้องล้มเหลว:", err);
    alert("สร้างห้องล้มเหลว กรุณาลองใหม่");
  }
}

async function joinRoom(id) {
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  try {
    const snap = await db.ref(`penaltyRooms/${id}`).once("value");
    const room = snap.val();
    if (!room || room.status !== "waiting") {
      alert("ห้องนี้ไม่สามารถเข้าร่วมได้แล้ว");
      loadRooms(); 
      return;
    }

    const players = room.players || {};
    const activePlayers = Object.values(players).filter(p => p && p.name);
    if (activePlayers.length >= 2) {
      alert("ห้องเต็มแล้ว");
      loadRooms(); 
      return;
    }

    roomId = id;
    const playerRef = db.ref(`penaltyRooms/${roomId}/players/${playerId}`);
    await playerRef.set({ name: playerName, team: null });
    playerRef.onDisconnect().remove();

    showRoom();

    setTimeout(() => {
      const manUButton = document.querySelector('#teamSelectInRoom button[data-team="Manchester United"]');
      if (manUButton && !manUButton.disabled) {
        manUButton.focus();
      } else {
        const firstAvailable = document.querySelector('#teamSelectInRoom button:not(.unavailable):not(:disabled)');
        if (firstAvailable) firstAvailable.focus();
      }
    }, 400);

  } catch (err) {
    console.error(err);
    alert("เข้าร่วมห้องล้มเหลว");
    loadRooms();
  }
}

function loadRooms() {
  const list = document.getElementById("roomList");
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  lobbyRoomsListener = db.ref("penaltyRooms").orderByChild("status").equalTo("waiting");
  lobbyRoomsListener.on("value", snap => {
    list.innerHTML = "";
    const now = Date.now();

    snap.forEach(r => {
      const room = r.val();
      const key = r.key;
      if (!room) return;

      const players = room.players || {};
      const activePlayers = Object.values(players).filter(p => p && p.name);
      const count = activePlayers.length;

      if (count === 0 || (room.created && now - room.created > 300000)) {
        db.ref(`penaltyRooms/${key}`).remove();
        return;
      }

      if (count < 2) {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${room.name}</strong> (${count}/2)`;
        const btn = document.createElement("button");
        btn.textContent = "เข้าร่วม";
        btn.style.cssText = "margin-left:10px;padding:5px 15px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;";
        btn.onclick = () => joinRoom(key);
        li.appendChild(btn);
        list.appendChild(li);
      }
    });
  });
}

function showRoom() {
  document.getElementById("lobby").style.display = "none";
  document.getElementById("room").style.display = "block";
  startSoundListener();

  if (currentRoomListener) currentRoomListener.off();
  currentRoomListener = db.ref(`penaltyRooms/${roomId}`);
  currentRoomListener.on("value", snap => {
    const room = snap.val();
    if (!room) { alert("ห้องถูกลบ"); location.reload(); return; }
    document.getElementById("roomName").textContent = `ห้อง: ${room.name}`;
    
    const players = room.players || {};
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    for (let id in players) {
      const p = players[id];
      if (p && p.name) {
        list.innerHTML += `<li>${p.name}${p.team ? ` - ${p.team}` : ""}</li>`;
      }
    }
    updateTeamButtons(room);

    const takenTeams = Object.values(players).filter(p => p && p.team).map(p => p.team);
    const teamDiv = document.getElementById("teamSelectInRoom");
    const waitMsg = document.getElementById("waitingMessage");
    const startBtn = document.getElementById("startBtn");

    if (players[playerId]?.team) {
      teamDiv.style.display = "none";
      waitMsg.style.display = "block";
      waitMsg.innerHTML = takenTeams.length === 1 ? "เลือกทีมแล้ว รอผู้เล่นที่เหลือ..." : "เลือกทีมแล้ว รอเจ้าของห้องกดเริ่มเกม…";
    } else {
      teamDiv.style.display = "flex";
      waitMsg.style.display = "none";
    }

    if (room.host === playerId && takenTeams.length === 2) {
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
    } else {
      startBtn.style.display = "none";
    }

    if (room.status === "playing") startGameplay(room, players);
    if (room.status === "finished") showResult(room);
  });
}

function updateTeamButtons(room) {
  const taken = Object.values(room.players || {}).filter(p => p && p.team).map(p => p.team);
  document.querySelectorAll(".team-btn").forEach(btn => {
    const team = btn.getAttribute("data-team");
    if (taken.includes(team)) {
      btn.classList.add("unavailable");
      btn.disabled = true;
    } else {
      btn.classList.remove("unavailable");
      btn.disabled = false;
    }
  });
}

function chooseTeam(team) {
  db.ref(`penaltyRooms/${roomId}/players/${playerId}/team`).set(team);
  triggerSound("friend.mp3");
  speak(`${playerName} เลือกทีม ${team}`);
}

function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  document.getElementById("startBtn").disabled = true;
  speak("เริ่มเกม!");

  db.ref(`penaltyRooms/${roomId}/players`).once("value").then(snap => {
    const players = snap.val();
    const keys = Object.keys(players);
    const p1Id = keys[0], p2Id = keys[1];
    const p1Team = players[p1Id].team;
    const p2Team = players[p2Id].team;
    
    const orderP1 = createShotsOrder(p1Team);
    const orderP2 = createShotsOrder(p2Team);   
    
    const firstShooter = Math.random() < 0.5 ? p1Id : p2Id;
    
    speak(`ทีม ${p1Team} ปะทะ ${p2Team}`);
    speak(`${players[firstShooter].name} จากทีม ${players[firstShooter].team} จะยิงลูกแรก`);
    
    db.ref(`penaltyRooms/${roomId}`).update({
      status: "playing", 
      firstShooter: firstShooter,
      turn: 0,
      scoreP1: 0, 
      scoreP2: 0, 
      shotIndexP1: 0, 
      shotIndexP2: 0,
      isSudden: false, 
      shooterDir: null, 
      keeperDir: null,
      processed: false,
      shotOrderP1: orderP1,
      shotOrderP2: orderP2,
      p1Id: p1Id,
      p2Id: p2Id
    });
  });
}

function startGameplay(room, players) {
  document.getElementById("room").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("currentTurn").style.display = "block";
  startBGM();

  shotOrderP1 = room.shotOrderP1 || [];
  shotOrderP2 = room.shotOrderP2 || [];

  const gameRef = db.ref(`penaltyRooms/${roomId}`);
  
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.classList.remove('locked');
    btn.disabled = false;
  });

  setTimeout(() => {
    const tlBtn = document.getElementById("tl");
    if (tlBtn) tlBtn.focus();
  }, 500);

  let lastTurn = -1;
  let lastIsSudden = false;

  gameRef.on("value", snap => {
    const data = snap.val();
    if (!data || data.status !== "playing") {
      document.querySelectorAll('.shot-btn').forEach(btn => {
        btn.style.display = 'none';
      });
      document.getElementById("currentTurn").style.display = "none";
      return;
    }

    const p1Id = data.p1Id;
    const p2Id = data.p2Id;
    const p1Team = players[p1Id]?.team || "ทีม 1";
    const p2Team = players[p2Id]?.team || "ทีม 2";
    const scoreP1 = data.scoreP1 || 0;
    const scoreP2 = data.scoreP2 || 0;
    const shotIndexP1 = data.shotIndexP1 || 0;
    const shotIndexP2 = data.shotIndexP2 || 0;

    // 2. ปรับ Scoreboard ให้แสดงชื่อทีมและจำนวนลูกที่ยิงชัดเจนเหมือน penalty.html
    document.getElementById("scoreBoard").innerText = 
      `${p1Team} ${scoreP1} (ยิง ${shotIndexP1}) - ${scoreP2} (ยิง ${shotIndexP2}) ${p2Team}`;

    const currentShooterId = data.turn % 2 === 0 ? data.firstShooter : (data.firstShooter === p1Id ? p2Id : p1Id);
    const currentKeeperId = currentShooterId === p1Id ? p2Id : p1Id;

    // ตรวจสอบว่าผู้เล่นคนนี้กดเลือกมุมในเทิร์นนี้ไปแล้วหรือยัง
    const alreadyChosen = (playerId === currentShooterId && Boolean(data.shooterDir)) ||
                          (playerId === currentKeeperId && Boolean(data.keeperDir));

    isMyTurn = (playerId === currentShooterId || playerId === currentKeeperId) && !alreadyChosen && !data.processed;
    isButtonLocked = !isMyTurn;

    document.querySelectorAll('.shot-btn').forEach(btn => {
      if (isMyTurn) {
        btn.classList.remove('locked');
        btn.disabled = false;
        btn.style.display = 'block';
      } else {
        btn.classList.add('locked');
        btn.disabled = true;
        btn.style.display = 'block';
      }
    });

    const currentTurnEl = document.getElementById("currentTurn");
    const action = playerId === currentShooterId ? "ยิง!" : "เซฟ!";
    currentTurnEl.textContent = alreadyChosen ? `เลือกมุมแล้ว รออีกฝ่าย...` : `ถึงตาคุณ${action}`;
    currentTurnEl.style.background = playerId === currentShooterId ? "rgba(76,175,80,0.9)" : "rgba(255,152,0,0.9)";
    currentTurnEl.style.color = "white";

    // แจ้งเตือนเมื่อเข้าสู่ซัดเดนเดธเป็นครั้งแรก
    if (data.isSudden && !lastIsSudden) {
      if (!spokenTurns.has("sudden")) {
        spokenTurns.add("sudden");
        speak("เสมอกันใน 5 ลูกแรก เข้าสู่ช่วงซัดเดนเดธ ยิงตัดสินกันคนละลูก!");
      }
    }
    lastIsSudden = data.isSudden;

    // แจ้งเตือนเมื่อเปลี่ยนเทิร์น
    if (data.turn !== lastTurn) {
      // ถ้าอยู่ในช่วงซัดเดนเดธ และเพิ่งขึ้นคู่ใหม่หลังจากยิงครบคู่แล้วเสมอกัน (ตั้งแต่ลูกที่ 6 เป็นต้นไป คือ shotIndexP1 > 5)
      if (data.isSudden && shotIndexP1 === shotIndexP2 && shotIndexP1 > 5) {
        const tieKey = `sudden_tie_${shotIndexP1}`;
        if (!spokenTurns.has(tieKey)) {
          spokenTurns.add(tieKey);
          speak(`เสมอกันในลูกที่ ${shotIndexP1} ต้องยิงตัดสินกันต่อในลูกถัดไป!`);
        }
      }

      lastTurn = data.turn;

      const shooterOrder = currentShooterId === p1Id ? shotOrderP1 : shotOrderP2;
      const shooterIndex = currentShooterId === p1Id ? shotIndexP1 : shotIndexP2;
      const shooterName = getShooterName(shooterOrder, shooterIndex);
      const keeperTeam = players[currentKeeperId].team;
      const keeperName = squads[keeperTeam].keeper;
      const shooterTeam = players[currentShooterId].team;

      if (playerId === currentShooterId && !spokenTurns.has(`turn_${data.turn}_shooter`)) {
        spokenTurns.add(`turn_${data.turn}_shooter`);
        speak(`ลูกที่ ${shooterIndex + 1} ฝั่งคุณ (${shooterTeam}): ${shooterName} เตรียมยิง`);
      }

      if (playerId === currentKeeperId && !spokenTurns.has(`turn_${data.turn}_keeper`)) {
        spokenTurns.add(`turn_${data.turn}_keeper`);
        speak(`ลูกที่ ${shooterIndex + 1} ฝั่งคู่แข่ง (${shooterTeam}): ${shooterName} เตรียมยิง ${keeperName} ของคุณพร้อมเซฟ`);
      }
    }

    if (data.shooterDir && data.keeperDir && !data.processed && data.turn > lastProcessedTurn) {
      lastProcessedTurn = data.turn;
      processShot(data, players, gameRef);
    }
  });
}

// 3. แก้ไข processShot: คำนวณกติกา FIFA และเช็กจบเกม/Sudden Death ให้เสร็จสิ้นก่อนอัปเดต Firebase รวดเดียว
async function processShot(data, players, gameRef) {
  const processedRef = gameRef.child('processed');
  const transactionResult = await processedRef.transaction(current => {
    if (current) return;
    return true;
  });

  if (!transactionResult.committed) return;

  const p1Id = data.p1Id;
  const p2Id = data.p2Id;
  const p1Team = players[p1Id].team;
  const p2Team = players[p2Id].team;
  const currentShooterId = data.turn % 2 === 0 ? data.firstShooter : (data.firstShooter === p1Id ? p2Id : p1Id);
  const currentKeeperId = currentShooterId === p1Id ? p2Id : p1Id;
  
  const shooterOrder = currentShooterId === p1Id ? shotOrderP1 : shotOrderP2;
  const shooterIndex = currentShooterId === p1Id ? data.shotIndexP1 : data.shotIndexP2;
  const shooterName = getShooterName(shooterOrder, shooterIndex);
  const shooterTeam = players[currentShooterId].team;

  const isGoal = data.shooterDir !== data.keeperDir;

  const soundName = isGoal 
    ? goalSounds[Math.floor(Math.random() * goalSounds.length)]
    : missSounds[Math.floor(Math.random() * missSounds.length)];

  triggerSound(soundName);

  let scoreP1 = data.scoreP1 || 0;
  let scoreP2 = data.scoreP2 || 0;
  if (isGoal) {
    currentShooterId === p1Id ? scoreP1++ : scoreP2++;
  }

  const nextShotIndexP1 = currentShooterId === p1Id ? data.shotIndexP1 + 1 : data.shotIndexP1;
  const nextShotIndexP2 = currentShooterId === p2Id ? data.shotIndexP2 + 1 : data.shotIndexP2;

  const resultMsg = `${shooterName} (${shooterTeam}) ยิง${isGoal ? "เข้า" : "ไม่เข้า"}! สกอร์ ${p1Team} ${scoreP1} ต่อ ${scoreP2} ${p2Team}`;
  speak(resultMsg);
  const live = document.getElementById("tts");
  live.textContent = resultMsg;
  setTimeout(() => live.textContent = "", 5000);

  // === คำนวณกติกา FIFA ทันที ===
  let end = false;
  let winnerId = null;
  let nextIsSudden = Boolean(data.isSudden);

  if (!nextIsSudden) {
    const remainingP1 = 5 - nextShotIndexP1;
    const remainingP2 = 5 - nextShotIndexP2;

    // เช็กว่ามีทีมไหนแต้มขาดลอยใน 5 ลูกแรกหรือยัง
    if (scoreP1 > scoreP2 + remainingP2) {
      end = true;
      winnerId = p1Id;
    } else if (scoreP2 > scoreP1 + remainingP1) {
      end = true;
      winnerId = p2Id;
    } else if (nextShotIndexP1 === 5 && nextShotIndexP2 === 5) {
      // ยิงครบ 5 ลูกทั้งสองฝั่งและแต้มเท่ากัน -> เข้าสู่ซัดเดนเดธทันทีในเทิร์นถัดไป
      if (scoreP1 === scoreP2) {
        nextIsSudden = true;
      }
    }
  } else {
    // ช่วงซัดเดนเดธ: เช็กเมื่อทั้งสองทีมยิงครบคู่แล้วเท่านั้น (จำนวนลูกที่ยิงเท่ากัน)
    if (nextShotIndexP1 === nextShotIndexP2) {
      if (scoreP1 !== scoreP2) {
        end = true;
        winnerId = scoreP1 > scoreP2 ? p1Id : p2Id;
      }
    }
  }

  setTimeout(() => {
    if (end) {
      // ถ้ารู้ผลแพ้ชนะแล้ว ให้จบเกมทันทีโดยไม่เปิดเทิร์นถัดไป
      triggerSound("end.mp3");
      stopBGM();
      setTimeout(() => {
        gameRef.update({
          scoreP1: scoreP1,
          scoreP2: scoreP2,
          shotIndexP1: nextShotIndexP1,
          shotIndexP2: nextShotIndexP2,
          status: "finished",
          winner: winnerId,
          finalScoreP1: scoreP1,
          finalScoreP2: scoreP2
        });
      }, 800);
    } else {
      // ถ้ายังไม่จบ อัปเดตเข้าเทิร์นถัดไปพร้อมสถานะ isSudden ในครั้งเดียว
      gameRef.update({
        turn: data.turn + 1,
        shooterDir: null, 
        keeperDir: null, 
        processed: false,
        scoreP1: scoreP1,
        scoreP2: scoreP2,
        shotIndexP1: nextShotIndexP1,
        shotIndexP2: nextShotIndexP2,
        isSudden: nextIsSudden
      });
    }
  }, 1200);
}

// 4. แก้ไข chooseDirection: ป้องกันการกดซ้ำระหว่างรอโหลดข้อมูลจาก Firebase
async function chooseDirection(dir) {
  try {
    const snap = await db.ref(`penaltyRooms/${roomId}`).once("value");
    const data = snap.val();
    if (!data || data.status !== "playing" || data.processed) return;
    
    const currentShooterId = data.turn % 2 === 0 ? data.firstShooter : (data.firstShooter === data.p1Id ? data.p2Id : data.p1Id);
    const currentKeeperId = currentShooterId === data.p1Id ? data.p2Id : data.p1Id;

    if (playerId === currentShooterId && !data.shooterDir) {
      await db.ref(`penaltyRooms/${roomId}/shooterDir`).set(dir);
      triggerSound(popSound);
    }
    else if (playerId === currentKeeperId && !data.keeperDir) {
      await db.ref(`penaltyRooms/${roomId}/keeperDir`).set(dir);
      triggerSound(popSound);
    } else {
      // กรณีไม่ได้ถูกบันทึก (เช่น สถานะยังไม่พร้อม) ให้ปลดล็อกตามสถานะเทิร์น
      isButtonLocked = false;
    }
  } catch (err) {
    console.error(err);
    isButtonLocked = false;
  }
}

function showResult(room) {
  stopBGM();
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("currentTurn").style.display = "none";
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.style.display = 'none';
  });

  const p1Team = room.players[room.p1Id].team;
  const p2Team = room.players[room.p2Id].team;
  const winnerTeam = room.winner === room.p1Id ? p1Team : p2Team;

  document.getElementById("resultTitle").textContent = `${winnerTeam} เป็นฝ่ายชนะ`;
  document.getElementById("resultMessage").textContent = "ยินดีด้วย!";
  document.getElementById("resultScreen").style.display = "flex";
  document.getElementById("mainMenuBtn").style.display = "block";

  if (!finalResultSpoken) {
    finalResultSpoken = true;
    const finalMsg = `${winnerTeam} เป็นฝ่ายชนะ ยินดีด้วย!`;
    speak(finalMsg);
    const live = document.getElementById("tts");
    live.textContent = finalMsg;
    setTimeout(() => live.textContent = "", 8000);
  }
}
