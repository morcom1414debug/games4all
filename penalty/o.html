// ===== Web Audio API =====
let audioCtx = null;
let bgmSource = null, bgmGain = null, bgmWanted = false;
const audioBuffers = {};

function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}
["pointerdown", "keydown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, () => { if (audioCtx) initAudio(); }, { passive: true })
);

async function loadBuffer(name) {
  if (!audioCtx || audioBuffers[name]) return;
  try {
    const res = await fetch(`audio/${name}`);
    const arr = await res.arrayBuffer();
    audioBuffers[name] = await new Promise((ok, no) => audioCtx.decodeAudioData(arr, ok, no));
    if (name === "b.mp3" && bgmWanted && !bgmSource) startBGM();
  } catch (e) {
    console.warn("โหลดเสียงไม่สำเร็จ:", name, e);
  }
}

function preloadAllSounds() {
  initAudio();
  const files = ["friend.mp3", "b.mp3", "end.mp3", popSound, ...goalSounds, ...missSounds];
  files.forEach(name => loadBuffer(name));
}

function playSound(name, volume = 1) {
  initAudio();
  const buf = audioBuffers[name];
  if (!audioCtx || !buf) return;
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  src.buffer = buf;
  gain.gain.value = volume;
  src.connect(gain).connect(audioCtx.destination);
  src.start(0);
}

function startBGM() {
  bgmWanted = true;
  initAudio();
  const buf = audioBuffers["b.mp3"];
  if (!audioCtx || !buf) return;
  if (bgmSource) return;
  bgmSource = audioCtx.createBufferSource();
  bgmGain = audioCtx.createGain();
  bgmSource.buffer = buf;
  bgmSource.loop = true;
  bgmGain.gain.value = 0.3;
  bgmSource.connect(bgmGain).connect(audioCtx.destination);
  bgmSource.start(0);
}
function stopBGM() {
  bgmWanted = false;
  if (bgmSource) {
    try { bgmSource.stop(0); } catch (e) {}
    bgmSource.disconnect();
    bgmSource = null;
  }
}

function startSoundListener() {
  if (soundListener) soundListener.off();
  if (!roomId) return;

  soundListener.on("value", s => {
    const data = s.val();
    if (!data || Date.now() - data.time > 1000) return;

    const name = data.name;
    playSound(name, 1);

    let msg = "";
    if (name === "end.mp3") msg = "จบเกม!";
    else if (name === "friend.mp3") msg = `${playerName} เลือกทีมแล้ว`;

    if (msg) {
      speak(msg);
      const live = document.getElementById("tts");
      live.textContent = msg;
      setTimeout(() => live.textContent = "", 3000);
    }
  });
}

let ttsQueue = [];
let isSpeaking = false;
const ttsDisplay = document.getElementById("ttsDisplay");

function speak(text){
  ttsQueue.push(text);
  processTTS();
}
function processTTS(){
  if(isSpeaking || ttsQueue.length === 0) return;
  isSpeaking = true;
  const msg = ttsQueue.shift();
  ttsDisplay.textContent = msg;
  ttsDisplay.classList.add('show');
  setTimeout(()=>{
    document.getElementById("tts").innerText = msg;
    setTimeout(()=>{
      isSpeaking = false;
      document.getElementById("tts").innerText = "";
      ttsDisplay.classList.remove('show');
      processTTS();
    }, Math.max(800, msg.length * 50));
  }, 50);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

  shuffle(players);
  return players;
}

async function showCreateRoom() {
  const name = prompt("ตั้งชื่อห้อง:");
  if (!name || name.trim() === "") return;

  const roomRef = db.ref("penaltyRooms").push();
  const newRoomId = roomRef.key;

  try {
    await roomRef.set({
      name: name.trim(),
      status: "waiting",
      host: playerId,
      created: Date.now(),
      players: {
        [playerId]: { name: playerName, team: null }
      }
    });

    const playerRef = db.ref(`penaltyRooms/${newRoomId}/players/${playerId}`);
    playerRef.onDisconnect().remove();

    roomId = newRoomId;
    isHost = true;
    showRoom();

    setTimeout(() => {
      const firstTeamBtn = document.querySelector("#teamSelectInRoom button");
      if (firstTeamBtn) firstTeamBtn.focus();
    }, 300);
  } catch (err) {
    console.error("สร้างห้องล้มเหลว:", err);
    alert("สร้างห้องล้มเหลว กรุณาลองใหม่");
  }
}

async function joinRoom(id) {
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  try {
    const snap = await db.ref(`penaltyRooms/${id}`).once("value");
    const room = snap.val();
    if (!room || room.status !== "waiting") {
      alert("ห้องนี้ไม่สามารถเข้าร่วมได้แล้ว");
      loadRooms(); 
      return;
    }

    const players = room.players || {};
    const activePlayers = Object.values(players).filter(p => p && p.name);
    if (activePlayers.length >= 2) {
      alert("ห้องเต็มแล้ว");
      loadRooms(); 
      return;
    }

    roomId = id;
    const playerRef = db.ref(`penaltyRooms/${roomId}/players/${playerId}`);
    await playerRef.set({ name: playerName, team: null });
    playerRef.onDisconnect().remove();

    showRoom();

    setTimeout(() => {
      const manUButton = document.querySelector('#teamSelectInRoom button[data-team="Manchester United"]');
      if (manUButton && !manUButton.disabled) {
        manUButton.focus();
      } else {
        const firstAvailable = document.querySelector('#teamSelectInRoom button:not(.unavailable):not(:disabled)');
        if (firstAvailable) firstAvailable.focus();
      }
    }, 400);

  } catch (err) {
    console.error(err);
    alert("เข้าร่วมห้องล้มเหลว");
    loadRooms();
  }
}

function loadRooms() {
  const list = document.getElementById("roomList");
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  lobbyRoomsListener = db.ref("penaltyRooms").orderByChild("status").equalTo("waiting");
  lobbyRoomsListener.on("value", snap => {
    list.innerHTML = "";
    const now = Date.now();

    snap.forEach(r => {
      const room = r.val();
      const key = r.key;
      if (!room) return;

      const players = room.players || {};
      const activePlayers = Object.values(players).filter(p => p && p.name);
      const count = activePlayers.length;

      if (count === 0 || (room.created && now - room.created > 300000)) {
        db.ref(`penaltyRooms/${key}`).remove();
        return;
      }

      if (count < 2) {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${room.name}</strong> (${count}/2)`;
        const btn = document.createElement("button");
        btn.textContent = "เข้าร่วม";
        btn.style.cssText = "margin-left:10px;padding:5px 15px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;";
        btn.onclick = () => joinRoom(key);
        li.appendChild(btn);
        list.appendChild(li);
      }
    });
  });
}

function showRoom() {
  document.getElementById("lobby").style.display = "none";
  document.getElementById("room").style.display = "block";
  startSoundListener();

  if (currentRoomListener) currentRoomListener.off();
  currentRoomListener = db.ref(`penaltyRooms/${roomId}`);
  currentRoomListener.on("value", snap => {
    const room = snap.val();
    if (!room) { alert("ห้องถูกลบ"); location.reload(); return; }
    document.getElementById("roomName").textContent = `ห้อง: ${room.name}`;
    
    const players = room.players || {};
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    for (let id in players) {
      const p = players[id];
      if (p && p.name) {
        list.innerHTML += `<li>${p.name}${p.team ? ` - ${p.team}` : ""}</li>`;
      }
    }
    updateTeamButtons(room);

    const takenTeams = Object.values(players).filter(p => p && p.team).map(p => p.team);
    const teamDiv = document.getElementById("teamSelectInRoom");
    const waitMsg = document.getElementById("waitingMessage");
    const startBtn = document.getElementById("startBtn");

    if (players[playerId]?.team) {
      teamDiv.style.display = "none";
      waitMsg.style.display = "block";
      waitMsg.innerHTML = takenTeams.length === 1 ? "เลือกทีมแล้ว รอผู้เล่นที่เหลือ..." : "เลือกทีมแล้ว รอเจ้าของห้องกดเริ่มเกม…";
    } else {
      teamDiv.style.display = "flex";
      waitMsg.style.display = "none";
    }

    if (room.host === playerId && takenTeams.length === 2) {
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
    } else {
      startBtn.style.display = "none";
    }

    if (room.status === "playing") startGameplay(room, players);
    if (room.status === "finished" && !resultScheduled) {
      resultScheduled = true;
      setTimeout(() => showResult(room), 2500);
    }
  });
}

function updateTeamButtons(room) {
  const taken = Object.values(room.players || {}).filter(p => p && p.team).map(p => p.team);
  document.querySelectorAll(".team-btn").forEach(btn => {
    const team = btn.getAttribute("data-team");
    if (taken.includes(team)) {
      btn.classList.add("unavailable");
      btn.disabled = true;
    } else {
      btn.classList.remove("unavailable");
      btn.disabled = false;
    }
  });
}

function chooseTeam(team) {
  db.ref(`penaltyRooms/${roomId}/players/${playerId}/team`).set(team);
  triggerSound("friend.mp3");
  speak(`${playerName} เลือกทีม ${team}`);
}

function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  document.getElementById("startBtn").disabled = true;
  speak("เริ่มเกม!");

  db.ref(`penaltyRooms/${roomId}/players`).once("value").then(snap => {
    const players = snap.val();
    const keys = Object.keys(players);
    const p1Id = keys[0], p2Id = keys[1];
    const p1Team = players[p1Id].team;
    const p2Team = players[p2Id].team;
    
    const orderP1 = createShotsOrder(p1Team);
    const orderP2 = createShotsOrder(p2Team);   
    
    const firstShooter = Math.random() < 0.5 ? p1Id : p2Id;
    
    speak(`ทีม ${p1Team} ปะทะ ${p2Team}`);
    speak(`${players[firstShooter].name} จากทีม ${players[firstShooter].team} จะยิงลูกแรก`);
    
    db.ref(`penaltyRooms/${roomId}`).update({
      status: "playing", 
      firstShooter: firstShooter,
      turn: 0,
      scoreP1: 0, 
      scoreP2: 0, 
      shotIndexP1: 0, 
      shotIndexP2: 0,
      isSudden: false, 
      picks: null,
      lastResult: null,
      shotOrderP1: orderP1,
      shotOrderP2: orderP2,
      p1Id: p1Id,
      p2Id: p2Id
    });
  });
}

// ===== ตัวแปรควบคุมความปลอดภัยของ logic =====
let gameplayStarted = false;
let resultScheduled = false;
let liveData = null;
let pickedTurn = -1;
let resolvingTurn = -1;
let inputUnlockAt = 0;
let announcedResultTurn = -1;
let watchdogTimer = null;

function getRoles(d) {
  const p1 = d.p1Id, p2 = d.p2Id;
  const shooterId = d.turn % 2 === 0 ? d.firstShooter : (d.firstShooter === p1 ? p2 : p1);
  const keeperId = shooterId === p1 ? p2 : p1;
  return { shooterId, keeperId };
}

// กติกา FIFA: 5 ลูกแรก จบก่อนได้ถ้าอีกฝ่ายตามไม่ทัน / ซัดเดนเดธ ตัดสินเมื่อยิงเท่ากันแล้วคะแนนต่าง
function evaluateShootout(s1, s2, n1, n2) {
  if (n1 <= 5 && n2 <= 5) {
    const rem1 = 5 - n1, rem2 = 5 - n2;
    if (s1 > s2 + rem2) return { end: true, winner: 1, sudden: false };
    if (s2 > s1 + rem1) return { end: true, winner: 2, sudden: false };
    if (n1 === 5 && n2 === 5 && s1 === s2) return { end: false, winner: 0, sudden: true };
    return { end: false, winner: 0, sudden: false };
  }
  if (n1 === n2 && s1 !== s2) return { end: true, winner: s1 > s2 ? 1 : 2, sudden: false };
  return { end: false, winner: 0, sudden: false };
}

function announceResult(data) {
  const r = data.lastResult;
  if (!r || r.turn <= announcedResultTurn) return;
  announcedResultTurn = r.turn;
  const resultMsg = `${r.shooterName} จากทีม ${r.shooterTeam} ยิง${r.isGoal ? "เข้า" : "ไม่เข้า"}! คะแนน ${r.scoreP1} - ${r.scoreP2}`;
  speak(resultMsg);
  const live = document.getElementById("tts");
  live.textContent = resultMsg;
  setTimeout(() => live.textContent = "", 5000);
}

function startGameplay(room, players) {
  if (gameplayStarted) return;      // กัน listener ซ้อนกัน
  gameplayStarted = true;

  document.getElementById("room").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("currentTurn").style.display = "block";
  startBGM();

  shotOrderP1 = room.shotOrderP1 || [];
  shotOrderP2 = room.shotOrderP2 || [];

  const gameRef = db.ref(`penaltyRooms/${roomId}`);
  
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.classList.remove('locked');
    btn.disabled = false;
  });

  setTimeout(() => {
    const tlBtn = document.getElementById("tl");
    if (tlBtn) tlBtn.focus();
  }, 500);

  let lastTurn = -1;
  let lastIsSudden = false;

  gameRef.on("value", snap => {
    const data = snap.val();
    liveData = data;

    if (data) announceResult(data);

    if (!data || data.status !== "playing") {
      document.querySelectorAll('.shot-btn').forEach(btn => {
        btn.style.display = 'none';
      });
      document.getElementById("currentTurn").style.display = "none";
      if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
      return;
    }

    const players = data.players || {};
    shotOrderP1 = data.shotOrderP1 || [];
    shotOrderP2 = data.shotOrderP2 || [];

    const scoreP1 = data.scoreP1 || 0;
    const scoreP2 = data.scoreP2 || 0;
    document.getElementById("scoreBoard").innerText = 
      `Score: ${scoreP1} - ${scoreP2}`;

    const p1Id = data.p1Id;
    const p2Id = data.p2Id;
    
    const { shooterId: currentShooterId, keeperId: currentKeeperId } = getRoles(data);
    isMyTurn = (playerId === currentShooterId || playerId === currentKeeperId);

    const alreadyPicked = pickedTurn === data.turn;
    document.querySelectorAll('.shot-btn').forEach(btn => {
      if (isMyTurn) {
        btn.classList.toggle('locked', alreadyPicked);
        btn.setAttribute('aria-disabled', alreadyPicked ? 'true' : 'false');
        btn.disabled = false;
        btn.style.display = 'block';
      } else {
        btn.classList.add('locked');
        btn.disabled = true;
      }
    });

    const currentTurnEl = document.getElementById("currentTurn");
    const action = playerId === currentShooterId ? "ยิง!" : "เซฟ!";
    currentTurnEl.textContent = `ถึงตาคุณ${action}`;
    currentTurnEl.style.background = playerId === currentShooterId ? "rgba(76,175,80,0.9)" : "rgba(255,152,0,0.9)";
    currentTurnEl.style.color = "white";

    if (data.turn !== lastTurn) {
      lastTurn = data.turn;
      inputUnlockAt = Date.now() + 800;   // กันกดแซง/กดค้างข้ามตา

      const shooterOrder = currentShooterId === p1Id ? shotOrderP1 : shotOrderP2;
      const shooterIndex = currentShooterId === p1Id ? data.shotIndexP1 : data.shotIndexP2;
      const shooterName = getShooterName(shooterOrder, shooterIndex);
      const keeperTeam = players[currentKeeperId].team;
      const keeperName = squads[keeperTeam].keeper;
      const shooterTeam = players[currentShooterId].team;

      if (playerId === currentShooterId && !spokenTurns.has(`turn_${data.turn}_shooter`)) {
        spokenTurns.add(`turn_${data.turn}_shooter`);
        speak(`ลูกที่ ${shooterIndex + 1} ${shooterTeam}: ${shooterName} เตรียมยิง`);
      }

      if (playerId === currentKeeperId && !spokenTurns.has(`turn_${data.turn}_keeper`)) {
        spokenTurns.add(`turn_${data.turn}_keeper`);
        speak(`ลูกที่ ${shooterIndex + 1} ${shooterTeam}: ${shooterName} เตรียมยิง ${keeperName} ของคุณพร้อมเซฟ`);
      }
    }

    if (data.isSudden && !lastIsSudden) {
      if (!spokenTurns.has("sudden")) {
        spokenTurns.add("sudden");
        speak("เข้าสู่ซัดเดนเดธ!");
      }
    }
    lastIsSudden = data.isSudden;

    tryResolve(gameRef);
  });

  // watchdog: ถ้าเครื่องที่ตัดสินผลหลุดหรือค้าง เครื่องที่เหลือจะมาทำต่อ
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(() => {
    resolvingTurn = -1;
    tryResolve(gameRef);
  }, 3000);
}

// ตัดสินผลทั้งหมด (คะแนน ตา ซัดเดนเดธ จบเกม) ใน transaction เดียว atomic
// เครื่องไหนทำก็ได้ แต่ผ่านได้ครั้งเดียวต่อ 1 ตา เพราะเช็ก room.turn === t
function tryResolve(gameRef) {
  const data = liveData;
  if (!data || data.status !== "playing" || typeof data.turn !== "number") return;
  const t = data.turn;
  const { shooterId, keeperId } = getRoles(data);
  const pk = (data.picks && data.picks["t" + t]) || {};
  if (!pk[shooterId] || !pk[keeperId]) return;
  if (resolvingTurn === t) return;
  resolvingTurn = t;

  gameRef.transaction(room => {
    if (!room || room.status !== "playing" || room.turn !== t) return;   // abort
    const roles = getRoles(room);
    const picks = (room.picks && room.picks["t" + t]) || {};
    const sDir = picks[roles.shooterId];
    const kDir = picks[roles.keeperId];
    if (!sDir || !kDir) return;
    if (!room.players || !room.players[roles.shooterId] || !room.players[roles.keeperId]) return;

    const isP1Shooter = roles.shooterId === room.p1Id;
    const order = (isP1Shooter ? room.shotOrderP1 : room.shotOrderP2) || [];
    let n1 = room.shotIndexP1 || 0, n2 = room.shotIndexP2 || 0;
    let s1 = room.scoreP1 || 0, s2 = room.scoreP2 || 0;

    const shooterName = getShooterName(order, isP1Shooter ? n1 : n2);
    const shooterTeam = room.players[roles.shooterId].team;
    const isGoal = sDir !== kDir;

    if (isGoal) { isP1Shooter ? s1++ : s2++; }
    isP1Shooter ? n1++ : n2++;

    const sound = isGoal
      ? goalSounds[Math.floor(Math.random() * goalSounds.length)]
      : missSounds[Math.floor(Math.random() * missSounds.length)];

    const ev = evaluateShootout(s1, s2, n1, n2);

    room.turn = t + 1;
    room.scoreP1 = s1; room.scoreP2 = s2;
    room.shotIndexP1 = n1; room.shotIndexP2 = n2;
    room.isSudden = !!room.isSudden || ev.sudden;
    room.lastResult = {
      turn: t, shooterName, shooterTeam, isGoal,
      scoreP1: s1, scoreP2: s2, sound
    };
    if (ev.end) {
      room.status = "finished";
      room.winner = ev.winner === 1 ? room.p1Id : room.p2Id;
      room.finalScoreP1 = s1;
      room.finalScoreP2 = s2;
    }
    return room;
  }, (err, committed, snap) => {
    if (err || !committed) return;   // อีกเครื่องตัดสินไปแล้ว หรือรอข้อมูลล่าสุด (watchdog จะลองใหม่)
    const val = snap.val();
    if (!val || !val.lastResult || val.lastResult.turn !== t) return;
    triggerSound(val.lastResult.sound);
    if (val.status === "finished") {
      stopBGM();
      setTimeout(() => triggerSound("end.mp3"), 1500);
    }
  }, false);
}

// บันทึกการเลือก: แยกตามตาและตามผู้เล่น เขียนได้ครั้งเดียวต่อตา (กดซ้ำ/กดแซงไม่มีผล)
function chooseDirection(dir) {
  const d = liveData;
  if (!d || d.status !== "playing" || typeof d.turn !== "number") return;
  if (!["TL", "TR", "C", "BL", "BR"].includes(dir)) return;
  if (playerId !== d.p1Id && playerId !== d.p2Id) return;

  const t = d.turn;
  if (pickedTurn === t) return;
  pickedTurn = t;

  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.classList.add('locked');
    btn.setAttribute('aria-disabled', 'true');
  });

  db.ref(`penaltyRooms/${roomId}/picks/t${t}/${playerId}`).transaction(
    cur => cur ? undefined : dir,
    (err, committed) => {
      if (err) { if (pickedTurn === t) pickedTurn = -1; return; }
      if (committed) triggerSound(popSound);
    },
    false
  );
}

function showResult(room) {
  stopBGM();
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("currentTurn").style.display = "none";
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.style.display = 'none';
  });

  const p1Team = room.players[room.p1Id].team;
  const p2Team = room.players[room.p2Id].team;
  const winnerTeam = room.winner === room.p1Id ? p1Team : p2Team;

  document.getElementById("resultTitle").textContent = `${winnerTeam} เป็นฝ่ายชนะ`;
  document.getElementById("resultMessage").textContent = "ยินดีด้วย!";
  document.getElementById("resultScreen").style.display = "flex";
  document.getElementById("mainMenuBtn").style.display = "block";

  if (!finalResultSpoken) {
    finalResultSpoken = true;
    const finalMsg = `${winnerTeam} เป็นฝ่ายชนะ ยินดีด้วย!`;
    speak(finalMsg);
    const live = document.getElementById("tts");
    live.textContent = finalMsg;
    setTimeout(() => live.textContent = "", 8000);
  }
}
