// Web Audio API: โหลดไฟล์ครั้งเดียว แล้วเล่นด้วย AudioBufferSourceNode
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  audioUnlocked = true;
}
async function loadSound(name) {
  try {
    const response = await fetch(`audio/${name}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    audioBuffers[name] = await audioCtx.decodeAudioData(await response.arrayBuffer());
  } catch (error) { console.error("โหลดเสียงไม่สำเร็จ:", name, error); }
}
function preloadAllSounds() {
  initAudio();
  if (!preloadPromise) {
    preloadPromise = Promise.all([...new Set([
      "friend.mp3", "b.mp3", "end.mp3", popSound, ...goalSounds, ...missSounds
    ])].map(loadSound));
  }
  return preloadPromise;
}
function playSound(name, volume = 1, loop = false) {
  if (!audioCtx || !audioBuffers[name]) return null;
  const source = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  source.buffer = audioBuffers[name];
  source.loop = loop;
  gain.gain.value = volume;
  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
  return source;
}
function startBGM() {
  if (bgmSource) return;
  bgmSource = playSound("b.mp3", 0.3, true);
  if (!bgmSource && preloadPromise) {
    preloadPromise.then(() => {
      if (gameStarted && !bgmSource && document.getElementById("gameScreen").style.display !== "none")
        bgmSource = playSound("b.mp3", 0.3, true);
    });
  }
}
function stopBGM() {
  if (bgmSource) {
    try { bgmSource.stop(); } catch (e) {}
    bgmSource = null;
  }
}
function randomSound(names, last) {
  const available = names.filter(n => n !== last);
  return available[Math.floor(Math.random() * available.length)];
}
function triggerSound(name) {
  if (!roomId) return;
  db.ref(`penaltyRooms/${roomId}/soundTrigger`).set({
    name, time: Date.now(), playerId, eventId: db.ref().push().key
  }).catch(console.error);
}
function startSoundListener() {
  if (soundListener) soundListener.off();
  if (!roomId) return;
  soundListener = db.ref(`penaltyRooms/${roomId}/soundTrigger`);
  soundListener.on("value", snap => {
    const data = snap.val();
    if (!data || Date.now() - data.time > 10000) return;
    const id = data.eventId || `${data.playerId}_${data.time}_${data.name}`;
    if (id === lastPopEvent) return;
    lastPopEvent = id;
    playSound(data.name);
    if (data.name === "friend.mp3") speak("มีผู้เล่นเลือกทีมแล้ว");
  });
}

let ttsQueue = [];
let isSpeaking = false;
const ttsDisplay = document.getElementById("ttsDisplay");

function speak(text){
  ttsQueue.push(text);
  processTTS();
}
function processTTS(){
  if(isSpeaking || ttsQueue.length === 0) return;
  isSpeaking = true;
  const msg = ttsQueue.shift();
  ttsDisplay.textContent = msg;
  ttsDisplay.classList.add('show');
  setTimeout(()=>{
    document.getElementById("tts").innerText = msg;
    setTimeout(()=>{
      isSpeaking = false;
      document.getElementById("tts").innerText = "";
      ttsDisplay.classList.remove('show');
      processTTS();
    }, Math.max(800, msg.length * 50));
  }, 50);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function createShotsOrder(team){
  let players = squads[team].players.slice();
  shuffle(players);
  players.push(squads[team].keeper);
  return players;
}

function getShooterName(order, shotIndex) {
  const length = order.length;
  if (length === 0) return "นักเตะ";
  return order[shotIndex % length];
}

async function showCreateRoom() {
  const name = prompt("ตั้งชื่อห้อง:");
  if (!name || name.trim() === "") return;

  const roomRef = db.ref("penaltyRooms").push();
  const newRoomId = roomRef.key;

  try {
    await roomRef.set({
      name: name.trim(),
      status: "waiting",
      host: playerId,
      created: Date.now(),
      players: {
        [playerId]: { name: playerName, team: null }
      }
    });

    const playerRef = db.ref(`penaltyRooms/${newRoomId}/players/${playerId}`);
    playerRef.onDisconnect().remove();

    roomId = newRoomId;
    isHost = true;
    showRoom();

    setTimeout(() => {
      const firstTeamBtn = document.querySelector("#teamSelectInRoom button");
      if (firstTeamBtn) firstTeamBtn.focus();
    }, 300);
  } catch (err) {
    console.error("สร้างห้องล้มเหลว:", err);
    alert("สร้างห้องล้มเหลว กรุณาลองใหม่");
  }
}

async function joinRoom(id) {
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  try {
    const roomRef = db.ref(`penaltyRooms/${id}`);
    const result = await roomRef.transaction(room => {
      if (!room || room.status !== "waiting") return;
      const players = room.players || {};
      if (Object.values(players).filter(p => p && p.name).length >= 2) return;
      room.players = players;
      room.players[playerId] = { name: playerName, team: null };
      return room;
    }, undefined, false);
    if (!result.committed) {
      alert("ห้องนี้ไม่ว่างหรือไม่สามารถเข้าร่วมได้แล้ว");
      loadRooms();
      return;
    }
    roomId = id;
    db.ref(`penaltyRooms/${roomId}/players/${playerId}`).onDisconnect().remove();

    showRoom();

    setTimeout(() => {
      const manUButton = document.querySelector('#teamSelectInRoom button[data-team="Manchester United"]');
      if (manUButton && !manUButton.disabled) {
        manUButton.focus();
      } else {
        const firstAvailable = document.querySelector('#teamSelectInRoom button:not(.unavailable):not(:disabled)');
        if (firstAvailable) firstAvailable.focus();
      }
    }, 400);

  } catch (err) {
    console.error(err);
    alert("เข้าร่วมห้องล้มเหลว");
    loadRooms();
  }
}

  const list = document.getElementById("roomList");
  if (lobbyRoomsListener) lobbyRoomsListener.off();
  
  lobbyRoomsListener = db.ref("penaltyRooms").orderByChild("status").equalTo("waiting");
  lobbyRoomsListener.on("value", snap => {
    list.innerHTML = "";
    const now = Date.now();

    snap.forEach(r => {
      const room = r.val();
      const key = r.key;
      if (!room) return;

      const players = room.players || {};
      const activePlayers = Object.values(players).filter(p => p && p.name);
      const count = activePlayers.length;

      if (count === 0 || (room.created && now - room.created > 300000)) {
        db.ref(`penaltyRooms/${key}`).remove();
        return;
      }

      if (count < 2) {
        const li = document.createElement("li");
        const strong = document.createElement("strong");
        strong.textContent = room.name;
        li.appendChild(strong);
        li.appendChild(document.createTextNode(` (${count}/2)`));
        const btn = document.createElement("button");
        btn.textContent = "เข้าร่วม";
        btn.style.cssText = "margin-left:10px;padding:5px 15px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;";
        btn.onclick = () => joinRoom(key);
        li.appendChild(btn);
        list.appendChild(li);
      }
    });
  });
}

function showRoom() {
  document.getElementById("lobby").style.display = "none";
  document.getElementById("room").style.display = "block";
  startSoundListener();

  if (currentRoomListener) currentRoomListener.off();
  currentRoomListener = db.ref(`penaltyRooms/${roomId}`);
  currentRoomListener.on("value", snap => {
    const room = snap.val();
    if (!room) { alert("ห้องถูกลบ"); location.reload(); return; }
    document.getElementById("roomName").textContent = `ห้อง: ${room.name}`;
    
    const players = room.players || {};
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    for (let id in players) {
      const p = players[id];
      if (p && p.name) {
        const li = document.createElement("li");
        li.textContent = `${p.name}${p.team ? ` - ${p.team}` : ""}`;
        list.appendChild(li);
      }
    }
    updateTeamButtons(room);

    const takenTeams = Object.values(players).filter(p => p && p.team).map(p => p.team);
    const teamDiv = document.getElementById("teamSelectInRoom");
    const waitMsg = document.getElementById("waitingMessage");
    const startBtn = document.getElementById("startBtn");

    if (players[playerId]?.team) {
      teamDiv.style.display = "none";
      waitMsg.style.display = "block";
      waitMsg.innerHTML = takenTeams.length === 1 ? "เลือกทีมแล้ว รอผู้เล่นที่เหลือ..." : "เลือกทีมแล้ว รอเจ้าของห้องกดเริ่มเกม…";
    } else {
      teamDiv.style.display = "flex";
      waitMsg.style.display = "none";
    }

    if (room.host === playerId && takenTeams.length === 2) {
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
    } else {
      startBtn.style.display = "none";
    }

    if (room.status === "playing") startGameplay(room, players);
    if (room.status === "finished") showResult(room);
  });
}

function updateTeamButtons(room) {
  const taken = Object.values(room.players || {}).filter(p => p && p.team).map(p => p.team);
  document.querySelectorAll(".team-btn").forEach(btn => {
    const team = btn.getAttribute("data-team");
    if (taken.includes(team)) {
      btn.classList.add("unavailable");
      btn.disabled = true;
    } else {
      btn.classList.remove("unavailable");
      btn.disabled = false;
    }
  });
}

async function chooseTeam(team) {
  if (!roomId || !squads[team]) return;
  try {
    const result = await db.ref(`penaltyRooms/${roomId}`).transaction(room => {
      if (!room || room.status !== "waiting" || !room.players?.[playerId] ||
          room.players[playerId].team ||
          Object.values(room.players).some(p => p && p.team === team)) return;
      room.players[playerId].team = team;
      return room;
    }, undefined, false);
    if (result.committed) {
      triggerSound("friend.mp3");
      speak(`${playerName} เลือกทีม ${team}`);
    }
  } catch (error) { console.error("เลือกทีมไม่สำเร็จ:", error); }
}

async function startGame() {
  if (gameStarted || !isHost || !roomId) return;
  gameStarted = true;
  document.getElementById("startBtn").disabled = true;
  try {
    const initial = (await db.ref(`penaltyRooms/${roomId}`).once("value")).val();
    if (!initial || initial.status !== "waiting" || initial.host !== playerId) throw new Error("ห้องไม่พร้อม");
    const readyKeys = Object.keys(initial.players || {}).filter(k => initial.players[k]?.name && initial.players[k]?.team);
    if (readyKeys.length !== 2) throw new Error("ผู้เล่นไม่ครบ");
    const prepared = {
      firstShooter: Math.random() < 0.5 ? readyKeys[0] : readyKeys[1],
      orders: Object.fromEntries(readyKeys.map(k => [k, createShotsOrder(initial.players[k].team)]))
    };
    const result = await db.ref(`penaltyRooms/${roomId}`).transaction(room => {
      if (!room || room.status !== "waiting" || room.host !== playerId) return;
      const players = room.players || {};
      const keys = Object.keys(players).filter(k => players[k] && players[k].name && players[k].team);
      if (keys.length !== 2 || players[keys[0]].team === players[keys[1]].team) return;
      const [p1Id, p2Id] = keys;
      room.status = "playing";
      room.p1Id = p1Id;
      room.p2Id = p2Id;
      room.firstShooter = prepared.firstShooter;
      room.turn = 0;
      room.scoreP1 = 0; room.scoreP2 = 0;
      room.shotIndexP1 = 0; room.shotIndexP2 = 0;
      room.isSudden = false;
      room.shooterDir = null; room.keeperDir = null;
      room.processed = false;
      room.shotOrderP1 = prepared.orders[p1Id];
      room.shotOrderP2 = prepared.orders[p2Id];
      room.shotResult = null;
      return room;
    }, undefined, false);
    if (!result.committed) throw new Error("ห้องไม่พร้อมเริ่มเกม");
    speak("เริ่มเกม!");
  } catch (error) {
    console.error(error);
    gameStarted = false;
    document.getElementById("startBtn").disabled = false;
    alert("เริ่มเกมไม่สำเร็จ กรุณาตรวจสอบผู้เล่นและทีม");
  }
}

// คำนวณจากสถานะปัจจุบันภายใน transaction เดียวกันทุกครั้ง
function getMatchOutcome(room) {
  const a = room.shotIndexP1 || 0, b = room.shotIndexP2 || 0;
  const x = room.scoreP1 || 0, y = room.scoreP2 || 0;
  if (a <= 5 && b <= 5) {
    if (x > y + Math.max(0, 5 - b)) return room.p1Id;
    if (y > x + Math.max(0, 5 - a)) return room.p2Id;
    if (a === 5 && b === 5 && x !== y) return x > y ? room.p1Id : room.p2Id;
  }
  // Sudden death: ต้องยิงเท่ากันและเกิน 5 ลูกทั้งคู่เท่านั้น
  if (a >= 6 && a === b && x !== y) return x > y ? room.p1Id : room.p2Id;
  return null;
}
function currentActors(room) {
  const shooter = room.turn % 2 === 0 ? room.firstShooter :
    (room.firstShooter === room.p1Id ? room.p2Id : room.p1Id);
  return { shooter, keeper: shooter === room.p1Id ? room.p2Id : room.p1Id };
}
function updateInputState(room) {
  const actors = currentActors(room);
  const role = playerId === actors.shooter ? "shooterDir" :
    playerId === actors.keeper ? "keeperDir" : null;
  const canChoose = !!role && room.status === "playing" && !room[role] && !room.processed;
  isMyTurn = canChoose;
  isButtonLocked = !canChoose;
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.disabled = !canChoose;
    btn.classList.toggle('locked', !canChoose);
    btn.style.display = 'block';
  });
  const currentTurnEl = document.getElementById("currentTurn");
  currentTurnEl.textContent = role === "shooterDir" ?
    (canChoose ? "ถึงตาคุณยิง!" : "เลือกทิศทางยิงแล้ว รอคู่แข่ง") :
    (canChoose ? "ถึงตาคุณเซฟ!" : "เลือกทิศทางเซฟแล้ว รอคู่แข่ง");
  currentTurnEl.style.background = role === "shooterDir" ? "rgba(76,175,80,0.9)" : "rgba(255,152,0,0.9)";
  currentTurnEl.style.color = "white";
}

function startGameplay(room, players) {
  document.getElementById("room").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("currentTurn").style.display = "block";
  gameStarted = true;
  startBGM();
  if (activeGameRoom === roomId && gameplayListener) return;
  if (gameplayListener) gameplayListener.off();
  activeGameRoom = roomId;
  lastProcessedTurn = -1;
  const gameRef = db.ref(`penaltyRooms/${roomId}`);
  gameplayListener = gameRef;
  gameRef.on("value", snap => {
    const data = snap.val();
    if (!data || data.status !== "playing") {
      isButtonLocked = true;
      isMyTurn = false;
      return;
    }
    shotOrderP1 = data.shotOrderP1 || [];
    shotOrderP2 = data.shotOrderP2 || [];
    document.getElementById("scoreBoard").innerText = `Score: ${data.scoreP1 || 0} - ${data.scoreP2 || 0}`;
    updateInputState(data);
    const { shooter, keeper } = currentActors(data);
    const order = shooter === data.p1Id ? shotOrderP1 : shotOrderP2;
    const idx = shooter === data.p1Id ? data.shotIndexP1 : data.shotIndexP2;
    const shooterName = getShooterName(order, idx || 0);
    const shooterTeam = data.players?.[shooter]?.team || "";
    const keeperTeam = data.players?.[keeper]?.team || "";
    if (!spokenTurns.has(`turn_${data.turn}`)) {
      spokenTurns.add(`turn_${data.turn}`);
      if (playerId === shooter) speak(`ลูกที่ ${(idx || 0) + 1} ${shooterTeam}: ${shooterName} เตรียมยิง`);
      else if (playerId === keeper) speak(`ลูกที่ ${(idx || 0) + 1} ${shooterTeam}: ${shooterName} เตรียมยิง ${squads[keeperTeam]?.keeper || "ผู้รักษาประตู"} ของคุณพร้อมเซฟ`);
      setTimeout(() => document.getElementById("tl").focus(), 300);
    }
    if (data.isSudden && !spokenTurns.has("sudden")) {
      spokenTurns.add("sudden");
      speak("เข้าสู่ซัดเดนเดธ!");
    }
    const result = data.shotResult;
    if (result && result.turn > lastResultTurn) {
      lastResultTurn = result.turn;
      if (result.turn >= 0) {
        const msg = `${result.shooterName} จากทีม ${result.shooterTeam} ยิง${result.isGoal ? "เข้า" : "ไม่เข้า"}! คะแนน ${result.scoreP1} - ${result.scoreP2}`;
        speak(msg);
        playSound(result.soundName);
      }
    }
    if (data.shooterDir && data.keeperDir && !data.processed) {
      // ทุกเครื่องแข่งขัน transaction เดียวกัน ผู้ชนะ commit เท่านั้นที่บันทึกผล
      processShot(gameRef, data.turn);
    }
  });
}

async function processShot(gameRef, expectedTurn) {
  try {
    await gameRef.transaction(room => {
      if (!room || room.status !== "playing" || room.turn !== expectedTurn ||
          room.processed || !room.shooterDir || !room.keeperDir) return;
      const { shooter } = currentActors(room);
      const isGoal = room.shooterDir !== room.keeperDir;
      const idx = shooter === room.p1Id ? room.shotIndexP1 : room.shotIndexP2;
      const order = shooter === room.p1Id ? room.shotOrderP1 : room.shotOrderP2;
      const shooterName = getShooterName(order || [], idx || 0);
      const shooterTeam = room.players[shooter].team;
      if (isGoal) {
        if (shooter === room.p1Id) room.scoreP1++;
        else room.scoreP2++;
      }
      if (shooter === room.p1Id) room.shotIndexP1++;
      else room.shotIndexP2++;
      const names = isGoal ? goalSounds : missSounds;
      // ใช้เลขเทิร์นเลือกเสียงแบบคงที่ เพื่อให้ transaction retry ได้ผลเหมือนเดิม
      const soundName = names[expectedTurn % names.length];
      room.shotResult = {
        turn: expectedTurn, shooterName, shooterTeam, isGoal, soundName,
        scoreP1: room.scoreP1, scoreP2: room.scoreP2
      };
      room.shooterDir = null;
      room.keeperDir = null;
      room.processed = false;
      const winner = getMatchOutcome(room);
      if (winner) {
        room.status = "finished";
        room.winner = winner;
        room.finalScoreP1 = room.scoreP1;
        room.finalScoreP2 = room.scoreP2;
      } else {
        if (room.shotIndexP1 >= 5 && room.shotIndexP2 >= 5 && room.scoreP1 === room.scoreP2)
          room.isSudden = true;
        room.turn++;
      }
      return room;
    }, undefined, false);
  } catch (error) { console.error("ประมวลผลลูกยิงล้มเหลว:", error); }
}

async function chooseDirection(dir) {
  if (!roomId || !["TL", "TR", "C", "BL", "BR"].includes(dir)) return;
  const gameRef = db.ref(`penaltyRooms/${roomId}`);
  let committed = false;
  try {
    const result = await gameRef.transaction(room => {
      if (!room || room.status !== "playing" || room.processed) return;
      const { shooter, keeper } = currentActors(room);
      const field = playerId === shooter ? "shooterDir" : playerId === keeper ? "keeperDir" : null;
      if (!field || room[field]) return;
      room[field] = dir;
      return room;
    }, undefined, false);
    committed = result.committed;
    if (committed) {
      playSound(popSound);
      const updated = result.snapshot.val();
      if (updated?.shooterDir && updated?.keeperDir) processShot(gameRef, updated.turn);
    }
  } catch (error) { console.error("บันทึกทิศทางล้มเหลว:", error); }
  if (!committed) {
    // listener จะปลดล็อกเมื่อ Firebase ยืนยันว่าตานี้ยังเลือกได้
    const snap = await gameRef.once("value").catch(() => null);
    if (snap?.val()?.status === "playing") updateInputState(snap.val());
  }
}

function showResult(room) {
  if (room.shotResult && room.shotResult.turn > lastResultTurn) {
    lastResultTurn = room.shotResult.turn;
    playSound(room.shotResult.soundName);
    speak(`${room.shotResult.shooterName} จากทีม ${room.shotResult.shooterTeam} ยิง${room.shotResult.isGoal ? "เข้า" : "ไม่เข้า"}! คะแนน ${room.shotResult.scoreP1} - ${room.shotResult.scoreP2}`);
  }
  stopBGM();
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("currentTurn").style.display = "none";
  document.querySelectorAll('.shot-btn').forEach(btn => {
    btn.style.display = 'none';
  });

  const p1Team = room.players[room.p1Id].team;
  const p2Team = room.players[room.p2Id].team;
  const winnerTeam = room.winner === room.p1Id ? p1Team : p2Team;

  document.getElementById("resultTitle").textContent = `${winnerTeam} เป็นฝ่ายชนะ`;
  document.getElementById("resultMessage").textContent = "ยินดีด้วย!";
  document.getElementById("resultScreen").style.display = "flex";
  document.getElementById("mainMenuBtn").style.display = "block";

  if (!finalResultSpoken) {
    finalResultSpoken = true;
    playSound("end.mp3");
    const finalMsg = `${winnerTeam} เป็นฝ่ายชนะ ยินดีด้วย!`;
    speak(finalMsg);
    const live = document.getElementById("tts");
    live.textContent = finalMsg;
    setTimeout(() => live.textContent = "", 8000);
  }
}
