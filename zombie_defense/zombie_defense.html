<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Defense Audio Game</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            touch-action: none;
        }
        /* เพิ่ม CSS สำหรับปุ่ม Home ให้อยู่มุมซ้ายบน */
        .btn-home-main {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 24px;
            z-index: 1000;
        }
        #gameUI {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 90vh;
            outline: none; /* เอาขอบ Focus ออกเวลาใช้ Screen Reader */
            position: relative; /* เพิ่มเพื่อรองรับ Absolute Layout ของปุ่มควบคุม */
        }
        .status-bar {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
            background: #222;
            padding: 15px;
            border-radius: 10px;
        }
        /* ปรับปรุงโครงสร้าง Layout สำหรับระบบควบคุมใหม่ */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* ปล่อยให้สัมผัสผ่านไปยัง Swipe Area ได้ */
        }
        .controls > button {
            pointer-events: auto; /* เปิดให้ปุ่มรับการสัมผัส/คลิกได้ตามปกติ */
        }
        button {
            background-color: #444;
            color: #fff;
            border: 2px solid #fff;
            padding: 20px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active {
            background-color: #666;
        }
        #btnShoot {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 80px;
            font-size: 24px;
            background-color: #822;
            margin: 0;
            z-index: 100;
        }
        #btnLeft, #btnRight {
            position: absolute;
            top: 45vh; /* กึ่งกลางค่อนไปทางด้านบน */
            transform: translateY(-50%);
            width: 50px;
            height: 60px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-color: rgba(68, 68, 68, 0.4); /* ทำให้มองเห็นไม่เด่นชัดเกินไป */
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 100;
        }
        #btnLeft {
            left: 0;
            border-radius: 0 10px 10px 0;
        }
        #btnRight {
            right: 0;
            border-radius: 10px 0 0 10px;
        }
        #swipeArea {
            position: absolute;
            top: 15vh;
            left: 15%;
            width: 70%;
            height: 60vh;
            z-index: 50;
            background: transparent;
            border: none;
            touch-action: pan-y; /* ป้องกันการเลื่อนซ้ายขวาของ Browser แต่ไม่ปิดกั้นแนวดิ่งหรือ Screen Reader */
        }
        #startScreen {
            margin-top: 20vh;
        }
        #startScreen button {
            font-size: 30px;
            padding: 20px 40px;
            background-color: #282;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <!-- ปุ่มกลับสู่ชุมชน -->
    <button id="btn-home-main" class="btn-home-main" aria-label="กลับสู่ชุมชน" onclick="goHome()">
        <span aria-hidden="true">🏠</span>
    </button>

    <!-- ปรับปรุงหน้าแรก -->
    <div id="startScreen">
        <h1>Zombie Defense</h1>
        <p>ใส่หูฟังเพื่อประสบการณ์ 360 องศา</p>
        <!-- ซ่อนปุ่มเล่นต่อไว้ก่อน จะแสดงเมื่อมี Save -->
        <button id="btnContinue" style="display: none; background-color: #28a745; margin-bottom: 10px;">เล่นต่อ (Level ...)</button>
        <button id="btnNewGame">เริ่มเกมใหม่</button>
    </div>

    <!-- เพิ่มหน้า Game Over / เมนูหลังจบเกม -->
    <div id="gameOverScreen" style="display: none; margin-top: 15vh;">
        <h1 id="gameOverTitle">Game Over</h1>
        <p id="gameOverMessage"></p>
        <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;">
            <button id="btnRetry">เล่นอีกครั้ง (ด่านเดิม)</button>
            <button id="btnRestartGame">เริ่มต้นใหม่ (Level 1)</button>
            <button id="btnPauseExit">พักการเล่นไว้ก่อน</button>
        </div>
    </div>

    <!-- เพิ่ม tabindex="-1" เพื่อให้รับ Focus จาก JavaScript สำหรับผู้ใช้ Screen Reader -->
    <div id="gameUI" tabindex="-1">
        <div class="status-bar" aria-live="polite">
            <span id="txtLevel">Level: 1</span>
            <span id="txtHP">HP: 3</span>
            <span id="txtAmmo">Ammo: 10</span>
        </div>
        
        <div class="sr-only" aria-live="assertive" id="announcer"></div>

        <!-- พื้นที่ Swipe สำหรับผู้เล่นทั่วไป -->
        <div id="swipeArea" aria-hidden="true"></div>

        <div class="controls">
            <button id="btnLeft" aria-label="หมุนซ้าย">&#8592;</button>
            <button id="btnShoot" aria-label="ยิง หรือ รีโหลด">ยิง / Reload</button>
            <button id="btnRight" aria-label="หมุนขวา">&#8594;</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const LEVELS = [
            // --- โหมดแนะนำตัวละคร (Level 1-6) ---
            { total: 2, types: ['ธรรมดา'] },                                      // 1: ซ้อมยิงและฟังทิศทางทีละตัว
            { total: 3, types: ['ธรรมดา', 'วิ่งเร็ว'] },                            // 2: ฝึกความไว
            { total: 4, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา'] },                  // 3: ฝึกยิงซ้ำ
            { total: 5, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์'] },            // 4: ฝึกจัดลำดับความสำคัญเป้าหมายใหญ่
            { total: 6, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด'] },   // 5: ฝึกรับมือตัวอันตรายระยะประชิด
            { total: 8, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 6: รวมมิตรครบทุกชนิด

            // --- โหมดท้าทาย (Level 7-18) ค่อยๆ ไต่ระดับ ---
            { total: 10, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 7
            { total: 12, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 8
            { total: 14, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 9
            { total: 16, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 10
            { total: 18, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 11
            { total: 20, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 12
            { total: 22, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 13
            { total: 24, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 14
            { total: 26, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 15
            { total: 28, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 16
            { total: 30, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }, // 17
            { total: 35, types: ['ธรรมดา', 'วิ่งเร็ว', 'เกราะหนา', 'ยักษ์', 'ระเบิด', 'พิเศษ'] }  // 18
        ];

        const ZOMBIE_STATS = {
            'ธรรมดา': { hp: 1, speed: 2.0 },
            'วิ่งเร็ว': { hp: 1, speed: 3.5 },
            'เกราะหนา': { hp: 3, speed: 1.5 },
            'ยักษ์': { hp: 5, speed: 1.0 },
            'ระเบิด': { hp: 1, speed: 2.5 },
            'พิเศษ': { hp: 2, speed: 3.0 }
        };

        const AUDIO_FILES = {
            'ธรรมดา': 'audio/z ธรรมดา.mp3',
            'วิ่งเร็ว': 'audio/z วิ่งเร็ว.mp3',
            'เกราะหนา': 'audio/z เกราะหนา.mp3',
            'ยักษ์': 'audio/z ยักษ์.mp3',
            'ระเบิด': 'audio/z ระเบิด.mp3',
            'พิเศษ': 'audio/z พิเศษ.mp3',
            'shot': 'audio/shot.mp3',
            'hit1': 'audio/hit1.mp3',
            'hit2': 'audio/hit2.mp3',
            'levelup': 'audio/level up.mp3',
            'lose': 'audio/lose.mp3',
            'lose3': 'audio/lose3.mp3',
            'end': 'audio/end.mp3',
            'start': 'audio/start.mp3',
            'bgm': 'audio/bgm.mp3',
            'gift': 'audio/gift.mp3',
            'giftup': 'audio/giftup.mp3',
            'reload': 'audio/reload.mp3'
        };

        // ฟังก์ชันจัดการ Save/Load
        const SAVE_KEY = 'zombieDefenseSavedLevel';

        function saveProgress(level) {
            localStorage.setItem(SAVE_KEY, level);
        }

        function loadProgress() {
            let saved = localStorage.getItem(SAVE_KEY);
            return saved ? parseInt(saved) : 1;
        }

        // ฟังก์ชันตรวจสอบและตั้งค่าหน้าแรกตอนโหลดหน้าเว็บ
        function initStartScreen() {
            let savedLevel = loadProgress();
            const btnContinue = document.getElementById('btnContinue');
            const btnNewGame = document.getElementById('btnNewGame');

            if (savedLevel > 1 && savedLevel <= LEVELS.length) {
                btnContinue.style.display = "inline-block";
                btnContinue.innerText = `เล่นต่อ (Level ${savedLevel})`;
            } else {
                btnContinue.style.display = "none";
            }
        }
        // เรียกใช้ทันทีเมื่อเปิดเว็บ
        initStartScreen();

        // Variables
        let audioCtx, listener;
        let audioBuffers = {};
        
        let playerAngle = 0;
        let hp = 3;
        let ammo = 10;
        let currentLevel = 1;
        let isReloading = false;
        let lastShotTime = 0;
        let isGameOver = false;

        let activeZombies = [];
        let zombiesSpawned = 0;
        let spawnTimer = null;
        let gameLoopTimer = null;

        let keys = { ArrowLeft: false, ArrowRight: false };

        // Motion variables
        let motionEnabled = false;
        let motionListenersAttached = false;
        let lastAlpha = null;
        let lastMotionTime = 0;

        // New Audio & Item variables
        let bgmSource = null;
        let isStartingGame = false;
        let currentGift = null;
        let giftSpawnTimer = null;

        // DOM Elements
        const ui = {
            level: document.getElementById('txtLevel'),
            hp: document.getElementById('txtHP'),
            ammo: document.getElementById('txtAmmo'),
            announcer: document.getElementById('announcer')
        };

        // --- Audio System ---
        async function loadAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            listener = audioCtx.listener;
            
            // ตั้งค่า Listener ให้อยู่ตรงกลางเสมอ
            if(listener.positionX) {
                listener.positionX.value = 0;
                listener.positionY.value = 0;
                listener.positionZ.value = 0;
                listener.forwardX.value = 0;
                listener.forwardY.value = 0;
                listener.forwardZ.value = -1;
                listener.upX.value = 0;
                listener.upY.value = 1;
                listener.upZ.value = 0;
            } else {
                listener.setPosition(0, 0, 0);
                listener.setOrientation(0, 0, -1, 0, 1, 0);
            }

            let loadPromises = [];
            for (const [key, path] of Object.entries(AUDIO_FILES)) {
                if (audioBuffers[key]) continue; // โหลดครั้งเดียว
                let p = fetch(path)
                    .then(res => res.arrayBuffer())
                    .then(data => audioCtx.decodeAudioData(data))
                    .then(buffer => { audioBuffers[key] = buffer; })
                    .catch(e => console.error(`โหลดไฟล์เสียงไม่สำเร็จ: ${path}`));
                loadPromises.push(p);
            }
            await Promise.all(loadPromises);
        }

        function playSound(bufferName, volume = 1.0) {
            if (!audioBuffers[bufferName]) return;
            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            source.buffer = audioBuffers[bufferName];
            gainNode.gain.value = volume;
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            source.start(0);
        }
        
        function playBGM() {
            if (bgmSource || !audioBuffers['bgm']) return;
            bgmSource = audioCtx.createBufferSource();
            bgmSource.buffer = audioBuffers['bgm'];
            bgmSource.loop = true;
            let bgmGain = audioCtx.createGain();
            bgmGain.gain.value = 0.5; // ปรับระดับเสียงให้เหมาะสม
            bgmSource.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmSource.start(0);
        }
        
        function stopBGM() {
            if (bgmSource) {
                try { bgmSource.stop(); } catch(e) {}
                try { bgmSource.disconnect(); } catch(e) {}
                bgmSource = null;
            }
        }
        
        function goHome() {
            stopBGM();
            location.href = '../index.html';
        }

        window.addEventListener('beforeunload', () => {
            stopBGM();
        });

        function announce(text) {
            ui.announcer.innerText = text;
        }

        // --- Motion System ---
        async function requestMotion() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permOrient = await DeviceOrientationEvent.requestPermission();
                    const permMotion = await DeviceMotionEvent.requestPermission();
                    if (permOrient === 'granted' && permMotion === 'granted') {
                        motionEnabled = true;
                    } else {
                        motionEnabled = false;
                    }
                } catch (e) {
                    console.error("Motion Request Error:", e);
                    motionEnabled = false;
                }
            } else {
                // สำหรับ Android หรือเบราว์เซอร์ที่ไม่ต้องขอ Permission แยก
                motionEnabled = true;
            }

            if (motionEnabled && !motionListenersAttached) {
                window.addEventListener('deviceorientation', handleOrientation);
                // ยกเลิกการใช้งาน 'devicemotion' สำหรับยิงหรือ reload ตามข้อกำหนดใหม่
                motionListenersAttached = true;
            }
        }

        function handleOrientation(e) {
            if (isGameOver || !motionEnabled) return;
            let currentAlpha = e.alpha; // ค่า 0 - 360
            if (currentAlpha !== null) {
                if (lastAlpha !== null) {
                    let delta = currentAlpha - lastAlpha;
                    
                    // ปรับค่า Delta สำหรับการหมุนข้ามรอบวงกลม
                    if (delta > 180) delta -= 360;
                    if (delta < -180) delta += 360;
                    
                    // ป้องกันอาการกระตุก (Noise)
                    if (Math.abs(delta) > 0.3) {
                        playerAngle -= delta;
                        if (playerAngle < 0) playerAngle += 360;
                        if (playerAngle >= 360) playerAngle -= 360;
                    }
                }
                lastAlpha = currentAlpha;
            }
        }

        function handleMotion(e) {
            // ถูกยกเลิกการตรวจจับเพื่อการยิงตามข้อกำหนด (ย้ายไปควบคุมด้วยปุ่มยิงทั้งหมด)
        }

        // --- Game Logic ---
        class Zombie {
            constructor(type) {
                this.type = type;
                this.hp = ZOMBIE_STATS[type].hp;
                this.speed = ZOMBIE_STATS[type].speed;
                this.distance = 100; // เริ่มต้นห่างออกไป
                this.angle = Math.random() * 360; // สุ่มทิศทางเกิด
                this.active = true;

                // Setup Spatial Audio & Front-Back / Aim Enhancement Nodes
                this.source = audioCtx.createBufferSource();
                this.source.buffer = audioBuffers[type];
                this.source.loop = true;

                // 1. ฟิลเตอร์ปรับโทนเสียงด้านหน้า (ชัดเจน/เปิด) และด้านหลัง (ทึบลงอย่างเหมาะสมโดยไม่เสียเอกลักษณ์)
                this.toneFilter = audioCtx.createBiquadFilter();
                this.toneFilter.type = 'lowpass';
                this.toneFilter.frequency.value = 18000;
                this.toneFilter.Q.value = 0.7;

                this.presenceFilter = audioCtx.createBiquadFilter();
                this.presenceFilter.type = 'peaking';
                this.presenceFilter.frequency.value = 2800;
                this.presenceFilter.Q.value = 1.0;
                this.presenceFilter.gain.value = 0;

                // 2. ชุดสร้างเสียงสะท้อนสั้นๆ (Early Reflection) สำหรับจำลองมิติเสียงเมื่อซอมบี้อยู่ด้านหลัง
                this.rearDelay = audioCtx.createDelay(0.1);
                this.rearDelay.delayTime.value = 0.028;

                this.rearFilter = audioCtx.createBiquadFilter();
                this.rearFilter.type = 'bandpass';
                this.rearFilter.frequency.value = 750;
                this.rearFilter.Q.value = 0.8;

                this.rearReflectGain = audioCtx.createGain();
                this.rearReflectGain.gain.value = 0.0;

                // 3. Dynamic Gain สำหรับเพิ่มความเด่นเมื่อซอมบี้อยู่ในแนวยิง (±10 องศา)
                this.aimGain = audioCtx.createGain();
                this.aimGain.gain.value = 1.0;

                // 4. PannerNode แบบ HRTF เดิม
                this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF';
                this.panner.distanceModel = 'linear';
                this.panner.refDistance = 1;
                this.panner.maxDistance = 100;
                this.panner.rolloffFactor = 1;

                // เชื่อมต่อ Audio Graph สำหรับซอมบี้ตัวนี้
                // สายสัญญาณหลัก: source -> toneFilter -> presenceFilter -> aimGain -> panner -> destination
                this.source.connect(this.toneFilter);
                this.toneFilter.connect(this.presenceFilter);
                this.presenceFilter.connect(this.aimGain);

                // สายสัญญาณสะท้อนด้านหลัง: toneFilter -> rearDelay -> rearFilter -> rearReflectGain -> aimGain
                this.toneFilter.connect(this.rearDelay);
                this.rearDelay.connect(this.rearFilter);
                this.rearFilter.connect(this.rearReflectGain);
                this.rearReflectGain.connect(this.aimGain);

                this.aimGain.connect(this.panner);
                this.panner.connect(audioCtx.destination);
                this.source.start(0);

                this.updateAudioPosition();
            }

            setAudioParamSmooth(param, targetValue, timeConstant) {
                let now = audioCtx.currentTime;
                if (typeof param.setTargetAtTime === 'function') {
                    param.setTargetAtTime(targetValue, now, timeConstant);
                } else {
                    param.value = targetValue;
                }
            }

            updateAudioPosition() {
                if (!this.active) return;

                // คำนวณมุมสัมพัทธ์ระหว่างทิศที่ผู้เล่นหัน กับ ทิศที่ซอมบี้อยู่
                let relativeAngle = (this.angle - playerAngle) * (Math.PI / 180);
                
                // แปลงพิกัด 2D เป็นตำแหน่ง Panner (X, Z) รอบตัว Listener (0,0,0)
                let x = Math.sin(relativeAngle) * (this.distance / 10);
                let z = -Math.cos(relativeAngle) * (this.distance / 10);

                if (this.panner.positionX) {
                    this.panner.positionX.value = x;
                    this.panner.positionY.value = 0;
                    this.panner.positionZ.value = z;
                } else {
                    this.panner.setPosition(x, 0, z);
                }

                // คำนวณผลต่างมุม (0 ถึง 180 องศา) ด้วยสูตรเดียวกับระบบ Hit Detection
                let diff = Math.abs(this.angle - playerAngle) % 360;
                if (diff > 180) diff = 360 - diff;

                // 1) แยกเสียงด้านหน้า (cos >= 0) และด้านหลัง (cos < 0) ครบ 360 องศา
                // frontFactor มีค่าตั้งแต่ +1 (หน้าตรง) -> 0 (ซ้าย/ขวา 90 องศา) -> -1 (หลังตรง 180 องศา)
                let frontFactor = Math.cos(relativeAngle);
                let targetCutoff;
                let targetPresence;
                let targetRearReflect;

                if (frontFactor >= 0) {
                    // ครึ่งวงกลมด้านหน้า (หน้าตรง, หน้าซ้าย, หน้าขวา): เสียงเปิดชัดเจน
                    targetCutoff = 12000 + (frontFactor * 8000); // 12,000 Hz ถึง 20,000 Hz
                    targetPresence = frontFactor * 2.2;          // บูสต์ย่านความชัดเจนเล็กน้อยสูงสุด +2.2 dB
                    targetRearReflect = 0.0;                     // ไม่มีเสียงสะท้อนด้านหลัง
                } else {
                    // ครึ่งวงกลมด้านหลัง (หลังตรง, หลังซ้าย, หลังขวา): ลดความถี่สูงให้ทึบลงพอเหมาะและเพิ่มเสียงสะท้อนด้านหลัง
                    let backAmount = -frontFactor;               // 0 (ข้าง) ถึง 1 (หลังตรง)
                    // คงย่านความถี่ตั้งแต่ 1,350 Hz ขึ้นไปไว้เพื่อให้ซอมบี้ทั้ง 6 ประเภทยังคงเอกลักษณ์ชัดเจนและไม่หลอกระยะใกล้-ไกล
                    targetCutoff = 12000 - (backAmount * 10650); // ค่อยๆ ลดลงจาก 12,000 Hz เหลือต่ำสุด 1,350 Hz ที่ด้านหลังตรง
                    targetPresence = -backAmount * 3.0;          // ลดย่านความคมลงเล็กน้อยสูงสุด -3.0 dB
                    targetRearReflect = backAmount * 0.24;       // เพิ่มมิติเสียงสะท้อนด้านหลังอย่างพอเหมาะ
                }

                this.setAudioParamSmooth(this.toneFilter.frequency, targetCutoff, 0.05);
                this.setAudioParamSmooth(this.presenceFilter.gain, targetPresence, 0.05);
                this.setAudioParamSmooth(this.rearReflectGain.gain, targetRearReflect, 0.05);

                // 2) เพิ่มความเด่นของเสียงเมื่ออยู่ในแนวยิง (diff <= 10 องศา อ้างอิงเงื่อนไขเดียวกับระบบยิง)
                let targetAimGain = (diff <= 10) ? 1.45 : 1.0;
                this.setAudioParamSmooth(this.aimGain.gain, targetAimGain, 0.04);
            }

            takeDamage() {
                this.hp--;
                if (this.hp <= 0) {
                    playSound('hit2');
                    this.die();
                    return true;
                } else {
                    playSound('hit1');
                    return false;
                }
            }

            die() {
                if (!this.active) return;
                this.active = false;
                try {
                    this.source.stop();
                } catch (e) {}
                try {
                    this.source.disconnect();
                    this.toneFilter.disconnect();
                    this.presenceFilter.disconnect();
                    this.rearDelay.disconnect();
                    this.rearFilter.disconnect();
                    this.rearReflectGain.disconnect();
                    this.aimGain.disconnect();
                    this.panner.disconnect();
                } catch (e) {}
            }
        }

        class LifeGift {
            constructor() {
                this.distance = Math.random() * 60 + 20; // สุ่มระยะใกล้ไกล 20 ถึง 80
                this.angle = Math.random() * 360; // สุ่มทิศทางรอบตัว 360 องศา
                this.active = true;

                this.source = audioCtx.createBufferSource();
                this.source.buffer = audioBuffers['gift'];
                this.source.loop = true;

                this.toneFilter = audioCtx.createBiquadFilter();
                this.toneFilter.type = 'lowpass';
                this.toneFilter.frequency.value = 18000;
                this.toneFilter.Q.value = 0.7;

                this.presenceFilter = audioCtx.createBiquadFilter();
                this.presenceFilter.type = 'peaking';
                this.presenceFilter.frequency.value = 2800;
                this.presenceFilter.Q.value = 1.0;
                this.presenceFilter.gain.value = 0;

                this.rearDelay = audioCtx.createDelay(0.1);
                this.rearDelay.delayTime.value = 0.028;

                this.rearFilter = audioCtx.createBiquadFilter();
                this.rearFilter.type = 'bandpass';
                this.rearFilter.frequency.value = 750;
                this.rearFilter.Q.value = 0.8;

                this.rearReflectGain = audioCtx.createGain();
                this.rearReflectGain.gain.value = 0.0;

                this.aimGain = audioCtx.createGain();
                this.aimGain.gain.value = 1.0;

                this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF';
                this.panner.distanceModel = 'linear';
                this.panner.refDistance = 1;
                this.panner.maxDistance = 100;
                this.panner.rolloffFactor = 1;

                this.source.connect(this.toneFilter);
                this.toneFilter.connect(this.presenceFilter);
                this.presenceFilter.connect(this.aimGain);

                this.toneFilter.connect(this.rearDelay);
                this.rearDelay.connect(this.rearFilter);
                this.rearFilter.connect(this.rearReflectGain);
                this.rearReflectGain.connect(this.aimGain);

                this.aimGain.connect(this.panner);
                this.panner.connect(audioCtx.destination);
                this.source.start(0);

                this.updateAudioPosition();
            }

            setAudioParamSmooth(param, targetValue, timeConstant) {
                let now = audioCtx.currentTime;
                if (typeof param.setTargetAtTime === 'function') {
                    param.setTargetAtTime(targetValue, now, timeConstant);
                } else {
                    param.value = targetValue;
                }
            }

            updateAudioPosition() {
                if (!this.active) return;
                
                let relativeAngle = (this.angle - playerAngle) * (Math.PI / 180);
                let x = Math.sin(relativeAngle) * (this.distance / 10);
                let z = -Math.cos(relativeAngle) * (this.distance / 10);

                if (this.panner.positionX) {
                    this.panner.positionX.value = x;
                    this.panner.positionY.value = 0;
                    this.panner.positionZ.value = z;
                } else {
                    this.panner.setPosition(x, 0, z);
                }

                let diff = Math.abs(this.angle - playerAngle) % 360;
                if (diff > 180) diff = 360 - diff;

                let frontFactor = Math.cos(relativeAngle);
                let targetCutoff, targetPresence, targetRearReflect;

                if (frontFactor >= 0) {
                    targetCutoff = 12000 + (frontFactor * 8000);
                    targetPresence = frontFactor * 2.2;
                    targetRearReflect = 0.0;
                } else {
                    let backAmount = -frontFactor;
                    targetCutoff = 12000 - (backAmount * 10650);
                    targetPresence = -backAmount * 3.0;
                    targetRearReflect = backAmount * 0.24;
                }

                this.setAudioParamSmooth(this.toneFilter.frequency, targetCutoff, 0.05);
                this.setAudioParamSmooth(this.presenceFilter.gain, targetPresence, 0.05);
                this.setAudioParamSmooth(this.rearReflectGain.gain, targetRearReflect, 0.05);

                let targetAimGain = (diff <= 10) ? 1.45 : 1.0;
                this.setAudioParamSmooth(this.aimGain.gain, targetAimGain, 0.04);
            }

            cleanUp() {
                if (!this.active) return;
                this.active = false;
                try { this.source.stop(); } catch (e) {}
                try {
                    this.source.disconnect();
                    this.toneFilter.disconnect();
                    this.presenceFilter.disconnect();
                    this.rearDelay.disconnect();
                    this.rearFilter.disconnect();
                    this.rearReflectGain.disconnect();
                    this.aimGain.disconnect();
                    this.panner.disconnect();
                } catch (e) {}
            }
        }

        function resetGame() {
            hp = 3;
            ammo = 10;
            isReloading = false;
            lastShotTime = 0;
            isGameOver = false;
            playerAngle = 0;
            zombiesSpawned = 0;
            activeZombies.forEach(z => z.die());
            activeZombies = [];
            
            if (currentGift) {
                currentGift.cleanUp();
                currentGift = null;
            }
            clearTimeout(giftSpawnTimer);

            lastAlpha = null;
            keys = { ArrowLeft: false, ArrowRight: false };
            updateUI();
        }

        function updateUI() {
            ui.level.innerText = `Level: ${currentLevel}`;
            ui.hp.innerText = `HP: ${hp}`;
            if (isReloading) {
                ui.ammo.innerText = `Reloading...`;
            } else {
                ui.ammo.innerText = `Ammo: ${ammo}`;
            }
        }

        function shoot() {
            if (isGameOver) return;
            let now = audioCtx.currentTime;
            
            // Reload System
            if (ammo === 0) {
                if (!isReloading) {
                    isReloading = true;
                    playSound('reload'); // เล่นเสียง reload เมื่อกดกระสุนหมด
                    updateUI();
                    announce("กำลังรีโหลด");
                    setTimeout(() => {
                        ammo = 10;
                        isReloading = false;
                        updateUI();
                        announce("รีโหลดเสร็จสิ้น");
                    }, 2500);
                }
                return;
            }

            if (isReloading) return;
            if (now - lastShotTime < 0.5) return; // ยิงห่างกัน 0.5 วิ

            // ยิงกระสุน 1 นัด
            ammo--;
            lastShotTime = now;
            playSound('shot');
            updateUI();

            // Hit Detection - หาเป้าหมายที่อยู่ตรงหน้า (ระยะศูนย์เล็ง +- 10 องศา) และใกล้ที่สุด
            let hitTarget = null;
            let minDistance = 999;

            // เช็คซอมบี้
            for (let z of activeZombies) {
                if (!z.active) continue;
                let diff = Math.abs(z.angle - playerAngle) % 360;
                if (diff > 180) diff = 360 - diff;

                if (diff <= 10) { // อยู่ในระยะเล็ง
                    if (z.distance < minDistance) {
                        minDistance = z.distance;
                        hitTarget = z;
                    }
                }
            }

            // เช็ค Life Gift
            if (currentGift && currentGift.active) {
                let diff = Math.abs(currentGift.angle - playerAngle) % 360;
                if (diff > 180) diff = 360 - diff;
                
                if (diff <= 10) {
                    if (currentGift.distance < minDistance) {
                        minDistance = currentGift.distance;
                        hitTarget = currentGift;
                    }
                }
            }

            if (hitTarget) {
                if (hitTarget instanceof Zombie) {
                    hitTarget.takeDamage();
                } else if (hitTarget instanceof LifeGift) {
                    playSound('giftup');
                    hp = Math.min(3, hp + 1); // เพิ่มพลังสูงสุดไม่เกิน 3
                    updateUI();
                    announce(`เก็บ Life Gift สำเร็จ! พลังชีวิตเป็น ${hp}`);
                    hitTarget.cleanUp();
                    if (currentGift === hitTarget) {
                        currentGift = null;
                    }
                }
            }

            checkLevelClear();
        }

        function getSpawnLimit(level) {
            if (level === 1) return 1; // เลเวล 1 ให้ออกทีละตัวเท่านั้น
            if (level <= 4) return 2;  // เลเวล 2-4 ออกพร้อมกันได้สูงสุด 2 ตัว
            if (level <= 9) return 3;  // เลเวล 5-9 ออกพร้อมกันได้สูงสุด 3 ตัว
            return 4;                  // เลเวล 10 ขึ้นไป ออกพร้อมกันสูงสุด 4 ตัว
        }

        function spawnZombie(levelData) {
            if (isGameOver) return;
            if (zombiesSpawned >= levelData.total) return;
            
            clearTimeout(spawnTimer);
            
            let activeCount = activeZombies.filter(z => z.active).length;
            let maxConcurrent = getSpawnLimit(currentLevel);

            if (activeCount < maxConcurrent) {
                let types = levelData.types;
                let randomType = types[Math.floor(Math.random() * types.length)];
                activeZombies.push(new Zombie(randomType));
                zombiesSpawned++;
                
                // ถัดไปหน่วงเวลา 1.5 - 3 วินาที (ถ้าไม่ใช่เลเวล 1 ที่ต้องรอให้ตายก่อน)
                if (zombiesSpawned < levelData.total && currentLevel > 1) {
                    let nextSpawnTime = Math.random() * 1500 + 1500;
                    spawnTimer = setTimeout(() => spawnZombie(levelData), nextSpawnTime);
                }
            } else {
                // คิวซอมบี้เต็ม หน่วงเวลาเช็คใหม่โดยไม่ต้องรอนานนัก
                spawnTimer = setTimeout(() => spawnZombie(levelData), 500);
            }
        }

        function checkLevelClear() {
            activeZombies = activeZombies.filter(z => z.active);
            let levelData = LEVELS[currentLevel - 1];

            if (activeZombies.length === 0 && zombiesSpawned >= levelData.total) {
                clearTimeout(spawnTimer);
                
                if (currentLevel >= 18) {
                    saveProgress(1); // จบเกมแล้ว รีเซ็ต Save
                    gameOver(true);
                } else {
                    playSound('levelup');
                    announce(`ผ่านเลเวล ${currentLevel}`);
                    currentLevel++;
                    saveProgress(currentLevel); // <--- บันทึกด่านใหม่ลงเครื่องทันที
                    setTimeout(startLevel, 3000);
                }
            } else if (currentLevel === 1 && activeZombies.length === 0 && zombiesSpawned < levelData.total) {
                clearTimeout(spawnTimer);
                spawnZombie(levelData);
            }
        }

        function gameOver(isWin) {
            isGameOver = true;
            clearTimeout(spawnTimer);
            clearTimeout(giftSpawnTimer);

            if (currentGift) {
                currentGift.cleanUp();
                currentGift = null;
            }

            if (gameLoopTimer) {
                cancelAnimationFrame(gameLoopTimer);
                gameLoopTimer = null;
            }
            activeZombies.forEach(z => z.die());
            activeZombies = [];

            const gameUI = document.getElementById('gameUI');
            gameUI.removeAttribute('role');
            gameUI.removeAttribute('aria-label');
            gameUI.blur();

            document.getElementById('gameUI').style.display = "none";
            document.getElementById('gameOverScreen').style.display = "block"; // แสดงหน้า Game Over
            
            // แสดงปุ่มโฮมอีกครั้งในหน้าจบเกม
            document.getElementById('btn-home-main').style.display = "block";

            const title = document.getElementById('gameOverTitle');
            const msg = document.getElementById('gameOverMessage');
            const btnRetry = document.getElementById('btnRetry');

            if (!isWin) {
                playSound('lose3');
                title.innerText = "Game Over!";
                msg.innerText = `คุณไม่รอด หยุดอยู่ที่ Level ${currentLevel}`;
                announce(`คุณไม่รอด หยุดอยู่ที่ Level ${currentLevel}`);
            } else {
                playSound('end');
                title.innerText = "Victory!";
                msg.innerText = "ยินดีด้วย คุณรอดชีวิตจากซอมบี้ทั้งหมด!";
                announce("ยินดีด้วย คุณเอาชนะฝูงซอมบี้ทั้งหมด 18 เลเวลได้สำเร็จ!");
            }

            // ย้าย Focus ไปที่ปุ่มแรกให้ Screen Reader อ่านอัตโนมัติ
            setTimeout(() => btnRetry.focus(), 500); 
        }

        function startLevel() {
            updateUI();
            zombiesSpawned = 0;
            activeZombies = [];
            clearTimeout(spawnTimer);
            clearTimeout(giftSpawnTimer);

            if (currentGift) {
                currentGift.cleanUp();
                currentGift = null;
            }

            announce(`เริ่มเลเวล ${currentLevel}`);
            
            let levelData = LEVELS[currentLevel - 1];
            spawnTimer = setTimeout(() => spawnZombie(levelData), 2000);

            // เกิด Life Gift ตั้งแต่ Level 4 ขึ้นไป ด่านละไม่เกิน 1 ชิ้น
            if (currentLevel >= 4) {
                let spawnDelay = Math.random() * 5000 + 3000;
                giftSpawnTimer = setTimeout(() => {
                    if (!isGameOver && !currentGift) {
                        currentGift = new LifeGift();
                    }
                }, spawnDelay);
            }
        }

        function update() {
            if (isGameOver) return;

            // การหมุนของผู้เล่น (ปุ่มหรือคีย์บอร์ด)
            if (keys.ArrowLeft) playerAngle -= 1.5; // หมุนซ้าย
            if (keys.ArrowRight) playerAngle += 1.5; // หมุนขวา
            if (playerAngle < 0) playerAngle += 360;
            if (playerAngle >= 360) playerAngle -= 360;

            // อัปเดตตำแหน่งเสียง Life Gift ถ้ามี
            if (currentGift && currentGift.active) {
                currentGift.updateAudioPosition();
            }

            // การเคลื่อนที่ของซอมบี้
            for (let z of activeZombies) {
                if (!z.active) continue;
                
                // เดินเข้าหา (ระยะลดลงเรื่อยๆ) * อิงเฟรมเรต 60fps
                z.distance -= z.speed * 0.02; 
                z.updateAudioPosition();

                // ซอมบี้ถึงฐาน (ทำร้ายผู้เล่น)
                if (z.distance <= 0) {
                    hp--;
                    z.distance = 40; // ซอมบี้กระเด็นถอยหลังกลับไปที่ระยะ 40
                    z.updateAudioPosition(); // อัปเดตตำแหน่งและระยะเสียงทันที เพื่อไม่ให้เสียงขาดตอน
                    updateUI();
                    
                    if (hp <= 0) {
                        gameOver(false);
                        return;
                    } else {
                        playSound('lose', 0.5);
                        announce(`ถูกโจมตี! พลังชีวิตเหลือ ${hp}`);
                        // ตัด checkLevelClear() ออก เพราะซอมบี้ยังไม่ตาย
                    }
                }
            }

            gameLoopTimer = requestAnimationFrame(update);
        }

        // --- Controls & Events ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.code === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
            if (e.code === 'ArrowRight') { keys.ArrowRight = true; e.preventDefault(); }
            if (e.code === 'Space') { shoot(); e.preventDefault(); }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
        });

        // Mobile Buttons & Accessibility Updates
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnShoot = document.getElementById('btnShoot');

        function handleTurnStep(direction) {
            if (isGameOver) return;
            if (direction === 'left') {
                playerAngle -= 15;
                if (playerAngle < 0) playerAngle += 360;
            } else {
                playerAngle += 15;
                if (playerAngle >= 360) playerAngle -= 360;
            }
        }

        btnLeft.addEventListener('touchstart', (e) => { keys.ArrowLeft = true; e.preventDefault(); }, { passive: false });
        btnLeft.addEventListener('touchend', (e) => { keys.ArrowLeft = false; e.preventDefault(); }, { passive: false });
        btnLeft.addEventListener('mousedown', () => keys.ArrowLeft = true);
        btnLeft.addEventListener('mouseup', () => keys.ArrowLeft = false);
        btnLeft.addEventListener('mouseleave', () => keys.ArrowLeft = false);
        btnLeft.addEventListener('click', (e) => {
            // ดักจับการสั่งงานแบบทีละ Step ผ่าน Screen Reader และการคลิกเพื่อรองรับพฤติกรรมปุ่มมาตรฐาน
            if (e.pointerType === '' || e.detail === 0 || e.isTrusted) {
                handleTurnStep('left');
            }
        });

        btnRight.addEventListener('touchstart', (e) => { keys.ArrowRight = true; e.preventDefault(); }, { passive: false });
        btnRight.addEventListener('touchend', (e) => { keys.ArrowRight = false; e.preventDefault(); }, { passive: false });
        btnRight.addEventListener('mousedown', () => keys.ArrowRight = true);
        btnRight.addEventListener('mouseup', () => keys.ArrowRight = false);
        btnRight.addEventListener('mouseleave', () => keys.ArrowRight = false);
        btnRight.addEventListener('click', (e) => {
            if (e.pointerType === '' || e.detail === 0 || e.isTrusted) {
                handleTurnStep('right');
            }
        });

        btnShoot.addEventListener('touchstart', (e) => { shoot(); e.preventDefault(); }, { passive: false });
        btnShoot.addEventListener('mousedown', (e) => { if (e.button === 0) shoot(); });
        btnShoot.addEventListener('click', () => { shoot(); });

        // --- Swipe System ---
        const swipeArea = document.getElementById('swipeArea');
        let swipeStartX = null;
        let swipeLastX = null;
        let swipeActive = false;

        swipeArea.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary) return;
            swipeStartX = e.clientX;
            swipeLastX = e.clientX;
            swipeActive = true;
            try { swipeArea.setPointerCapture(e.pointerId); } catch(err){}
        });

        swipeArea.addEventListener('pointermove', (e) => {
            if (isGameOver || !swipeActive || swipeStartX === null) return;
            let currentX = e.clientX;
            let deltaX = currentX - swipeLastX;
            
            // Dead Zone Check (ต้องเลื่อนอย่างน้อย 15px)
            if (Math.abs(currentX - swipeStartX) > 15) { 
                let rotation = deltaX * 0.4;
                // ป้องกันการหมุนกระชาก (จำกัดองศาต่อเฟรม)
                if (rotation > 12) rotation = 12;
                if (rotation < -12) rotation = -12;

                playerAngle += rotation;
                if (playerAngle < 0) playerAngle += 360;
                if (playerAngle >= 360) playerAngle -= 360;
            }
            swipeLastX = currentX;
        });

        swipeArea.addEventListener('pointerup', (e) => {
            swipeActive = false;
            swipeStartX = null;
            swipeLastX = null;
            try { swipeArea.releasePointerCapture(e.pointerId); } catch(err){}
        });
        
        swipeArea.addEventListener('pointercancel', (e) => {
            swipeActive = false;
            swipeStartX = null;
            swipeLastX = null;
        });

        // --- Initialize ---
        async function startGamePrep() {
            if (isStartingGame) return;
            isStartingGame = true;

            // ฟังก์ชันรวบยอดการเตรียม Audio และ Motion
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let pAudio = loadAudio();
            let pMotion = requestMotion();
            await Promise.all([pAudio, pMotion]);

            document.getElementById('startScreen').style.display = "none";
            document.getElementById('gameOverScreen').style.display = "none";
            
            // ซ่อนปุ่มกลับหน้าโฮมระหว่างการเล่น
            document.getElementById('btn-home-main').style.display = "none";

            const gameUI = document.getElementById('gameUI');
            gameUI.style.display = "flex";

            // เล่น start.mp3 แล้วรอให้จบก่อนเริ่มเกม
            await new Promise((resolve) => {
                if (!audioBuffers['start']) {
                    resolve();
                    return;
                }
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffers['start'];
                source.connect(audioCtx.destination);
                source.onended = resolve;
                source.start(0);
            });

            isStartingGame = false;

            // เริ่มเล่น BGM
            playBGM();

            gameUI.setAttribute('role', 'application');
            gameUI.setAttribute('aria-label', `เริ่มเลเวล ${currentLevel} ใช้ลูกศรซ้ายขวาเพื่อหมุน สเปซบาร์เพื่อยิงและรีโหลด`);
            gameUI.focus();
            
            resetGame();
            startLevel();
            if (!gameLoopTimer) {
                gameLoopTimer = requestAnimationFrame(update);
            }
        }

        // ปุ่ม: เล่นต่อ (โหลด Save)
        document.getElementById('btnContinue')?.addEventListener('click', async () => {
            currentLevel = loadProgress(); // ดึงด่านที่ค้างไว้
            await startGamePrep();
        });

        // ปุ่ม: เริ่มเกมใหม่ (ล้าง Save ทิ้ง เริ่ม 1)
        document.getElementById('btnNewGame').addEventListener('click', async () => {
            currentLevel = 1;
            saveProgress(1); // ล้าง Save เป็น Level 1
            await startGamePrep();
        });

        // ปุ่ม: เล่นอีกครั้ง (เริ่มด่านเดิมที่เพิ่งแพ้)
        document.getElementById('btnRetry').addEventListener('click', async () => {
            // currentLevel ยังคงเป็นค่าเดิมตอนที่ตาย
            await startGamePrep();
        });

        // ปุ่ม: เริ่มต้นใหม่ จากหน้า Game Over
        document.getElementById('btnRestartGame').addEventListener('click', async () => {
            currentLevel = 1;
            saveProgress(1);
            await startGamePrep();
        });

        // ปุ่ม: พักการเล่นไว้ก่อน (กลับไปหน้าแรก)
        document.getElementById('btnPauseExit').addEventListener('click', () => {
            document.getElementById('gameOverScreen').style.display = "none";
            document.getElementById('startScreen').style.display = "block";
            
            // แสดงปุ่มกลับหน้าโฮมเมื่อกลับมาที่หน้าแรก
            document.getElementById('btn-home-main').style.display = "block";
            
            initStartScreen(); // อัปเดตปุ่ม "เล่นต่อ" ให้แสดงเลเวลล่าสุด
            setTimeout(() => {
                const btnContinue = document.getElementById('btnContinue');
                if (btnContinue.style.display !== 'none') {
                    btnContinue.focus();
                } else {
                    document.getElementById('btnNewGame').focus();
                }
            }, 100);
        });

    </script>
</body>
</html>
