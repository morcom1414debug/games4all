<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Bit! - ฉลามงับ</title>
    <style>
        :root {
            --primary-color: #0077be;
            --secondary-color: #00a8cc;
            --accent-color: #ff6b6b;
            --bg-gradient: linear-gradient(to bottom, #1a8cff, #003366);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            white-space: nowrap;
        }

        /* เอฟเฟกต์แสงแดดส่องผิวน้ำ */
        .sunray-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* ตกแต่งตัวละครนักดำน้ำและฟองอากาศพื้นหลัง */
        .bg-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .chibi-diver {
            position: absolute;
            font-size: 3rem;
            opacity: 0.4;
            animation: swim 12s infinite alternate ease-in-out;
        }

        @keyframes swim {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, -40px) rotate(10deg); }
        }

        /* Game Container หลัก */
        .game-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        /* ปุ่มกลับสู่ชุมชน (มุมบนซ้าย) */
        .home-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ffffff;
            border: 2px solid #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .home-btn:hover, .home-btn:focus {
            background: #f0f0f0;
            transform: scale(1.05);
            outline: 2px solid var(--primary-color);
        }

        /* ปุ่มสลับภาษา (มุมบนขวา) */
        .lang-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover, .lang-btn:focus {
            background: var(--primary-color);
            color: #ffffff;
            transform: scale(1.05);
            outline: 2px solid #ffd700;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 5px;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            outline: none;
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .mode-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
        }

        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 119, 190, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn:hover, .btn:focus {
            background: #005fa3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 119, 190, 0.4);
            outline: 2px solid #ffd700;
        }

        .btn-secondary {
            background: var(--secondary-color);
            box-shadow: 0 4px 10px rgba(0, 168, 204, 0.3);
        }

        .btn-secondary:hover, .btn-secondary:focus {
            background: #008ba8;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }

        .btn-outline:hover, .btn-outline:focus {
            background: rgba(0, 119, 190, 0.05);
            color: var(--primary-color);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .rulebook-content {
            text-align: left;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .rulebook-content h3 {
            color: var(--primary-color);
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .rulebook-content ul {
            padding-left: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="sunray-overlay" aria-hidden="true"></div>

    <div class="bg-decorations" aria-hidden="true">
        <div class="bubble" style="left: 10%; width: 15px; height: 15px; animation-duration: 7s;"></div>
        <div class="bubble" style="left: 30%; width: 25px; height: 25px; animation-duration: 10s; animation-delay: 2s;"></div>
        <div class="bubble" style="left: 70%; width: 10px; height: 10px; animation-duration: 6s; animation-delay: 1s;"></div>
        <div class="bubble" style="left: 85%; width: 20px; height: 20px; animation-duration: 9s; animation-delay: 3s;"></div>
        
        <div class="chibi-diver" style="top: 15%; left: 5%;">🤿</div>
        <div class="chibi-diver" style="top: 65%; right: 8%; animation-delay: 3s;">🦈</div>
    </div>

    <main class="game-container">
        <!-- ปุ่มกลับสู่ชุมชน -->
        <button class="home-btn" id="btn-home" onclick="location.href='../index.html'" aria-label="กลับสู่ชุมชน">
            🏠
        </button>

        <!-- ปุ่มสลับภาษา -->
        <button class="lang-btn" id="btn-lang-toggle" onclick="toggleLanguage()" aria-label="สลับภาษาเป็นภาษาอังกฤษ">
            🌐 EN
        </button>

        <!-- หน้าจอหลัก: เลือกโหมด -->
        <div id="main-menu-screen" class="screen active">
            <h1 id="main-title" tabindex="-1">Get Bit!</h1>
            <p class="subtitle" id="main-subtitle">ฉลามงับ - เกมหนีตายใต้ท้องทะเล</p>

            <div class="menu-section">
                <p class="mode-label" id="mode-label">เลือกโหมด</p>
                
                <button class="btn" id="btn-bot" onclick="location.href='shark.html'">
                    เล่นกับบอท 🤖
                </button>

                <button class="btn btn-secondary" id="btn-online" onclick="location.href='sharkonline.html'">
                    เล่นออนไลน์ 🌐
                </button>

                <button class="btn btn-outline" id="btn-rulebook" onclick="switchScreen('rulebook-screen')">
                    คู่มือการเล่น 📖
                </button>
            </div>
        </div>

        <!-- หน้าจอคู่มือการเล่น -->
        <div id="rulebook-screen" class="screen">
            <h1 id="rulebook-title" tabindex="-1">คู่มือการเล่น</h1>
            <p class="subtitle" id="rulebook-subtitle">กติกาเบื้องต้นของ Get Bit!</p>

            <div class="rulebook-content" id="rulebook-content" tabindex="0" aria-label="เนื้อหากติกาการเล่น"></div>

            <button class="btn btn-outline" id="btn-close-rulebook" onclick="switchScreen('main-menu-screen')">
                ปิด / กลับหน้าหลัก 🔙
            </button>
        </div>
    </main>

    <!-- กล่องประกาศ ARIA -->
    <div id="aria-announcer" aria-live="assertive" class="sr-only"></div>

    <script>
        // 1. กำหนดชื่อ Key สำหรับเก็บค่าภาษาของเกมนี้
        const LANG_STORAGE_KEY = 'shark_lang';

        // 2. ฟังก์ชันตรวจสอบภาษา: อ่านจาก localStorage ก่อน -> ถ้าไม่มีค่อยอิงภาษา Browser
        function detectInitialLanguage() {
            try {
                const saved = localStorage.getItem(LANG_STORAGE_KEY);
                if (saved === 'th' || saved === 'en') return saved;
            } catch (e) {}
            const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            return browserLang.startsWith('th') ? 'th' : 'en';
        }

        let currentLang = detectInitialLanguage();

        const I18N = {
            th: {
                pageTitle: 'Get Bit! - ฉลามงับ',
                homeAria: 'กลับสู่ชุมชน',
                langBtnText: '🌐 EN',
                langBtnAria: 'สลับภาษาเป็นภาษาอังกฤษ',
                langChangedAnnounce: 'เปลี่ยนภาษาเป็นภาษาไทยแล้ว',
                mainTitle: 'Get Bit!',
                mainSubtitle: 'ฉลามงับ - เกมหนีตายใต้ท้องทะเล',
                modeLabel: 'เลือกโหมด',
                btnBot: 'เล่นกับบอท 🤖',
                btnOnline: 'เล่นออนไลน์ 🌐',
                btnRulebook: 'คู่มือการเล่น 📖',
                rulebookTitle: 'คู่มือการเล่น',
                rulebookSubtitle: 'กติกาเบื้องต้นของ Get Bit!',
                rulebookAria: 'เนื้อหากติกาการเล่น',
                btnCloseRulebook: 'ปิด / กลับหน้าหลัก 🔙',
                rulebookHTML: `
                    <h3>🎯 เป้าหมายของเกม</h3>
                    <p>เอาชีวิตรอดจากฉลามและเป็นนักดำน้ำคนสุดท้ายที่เหลือรอด (หรืออยู่หน้าสุดเมื่อเหลือผู้เล่น 2 คนสุดท้าย)</p>

                    <h3>🔄 ขั้นตอนในแต่ละรอบ</h3>
                    <ul>
                        <li><strong>เลือกการ์ด:</strong> ผู้เล่นทุกคนเลือกการ์ดตัวเลขในมือ (ค่าตั้งแต่ 1 ถึงตามจำนวนการ์ดที่เหลือ) คว่ำไว้ตรงหน้า แล้วเปิดพร้อมกัน</li>
                        <li><strong>ขยับตัวละคร:</strong> ผู้เล่นที่ลงเลขน้อยที่สุดจะได้ขยับไปข้างหน้าก่อน หากมีคนลงเลขซ้ำกัน เลขที่ซ้ำจะถูกยกเลิกและไม่ได้ขยับ</li>
                        <li><strong>ฉลามงับ:</strong> นักดำน้ำที่อยู่รั้งท้ายแถวสุด จะถูกฉลามงับและสูญเสียอวัยวะ 1 ชิ้น จากนั้นย้ายมาอยู่หน้าสุดของแถวและเก็บบัตรภาพขึ้นมือ</li>
                    </ul>

                    <h3>❌ เงื่อนไขการตกรอบ</h3>
                    <p>นักดำน้ำแต่ละคนจะมีอวัยวะ 4 ส่วน หากโดนฉลามงับครบทั้งหมดจะตกรอบทันที</p>
                `
            },
            en: {
                pageTitle: 'Get Bit! - Shark Bite',
                homeAria: 'Back to Community',
                langBtnText: '🌐 TH',
                langBtnAria: 'Switch language to Thai',
                langChangedAnnounce: 'Language switched to English',
                mainTitle: 'Get Bit!',
                mainSubtitle: 'Shark Bite - Deep Sea Survival Game',
                modeLabel: 'Select Mode',
                btnBot: 'Play vs Bots 🤖',
                btnOnline: 'Play Online 🌐',
                btnRulebook: 'Rulebook 📖',
                rulebookTitle: 'Rulebook',
                rulebookSubtitle: 'Basic Rules of Get Bit!',
                rulebookAria: 'Game Rules Content',
                btnCloseRulebook: 'Close / Back to Menu 🔙',
                rulebookHTML: `
                    <h3>🎯 Objective</h3>
                    <p>Survive the shark attack and be the last diver swimming (or stay in front when only 2 players remain).</p>

                    <h3>🔄 Round Phases</h3>
                    <ul>
                        <li><strong>Play Cards:</strong> Each player secretly selects a number card from their hand and reveals it simultaneously.</li>
                        <li><strong>Move Divers:</strong> Players with unique numbers move to the front of the line in ascending order. Duplicate numbers cancel out and do not move.</li>
                        <li><strong>Shark Bite:</strong> The diver at the very back of the line gets bitten by the shark, loses 1 limb, moves to the front of the line, and retrieves all their played cards.</li>
                    </ul>

                    <h3>❌ Elimination</h3>
                    <p>Each diver starts with 4 limbs. Once all 4 limbs are bitten off, that player is eliminated.</p>
                `
            }
        };

        // 3. ฟังก์ชันอัปเดต UI ทั้งหมดตาม currentLang
        function applyLanguageUI() {
            const t = I18N[currentLang];
            document.documentElement.lang = currentLang;
            document.title = t.pageTitle;

            document.getElementById('btn-home').setAttribute('aria-label', t.homeAria);

            const langBtn = document.getElementById('btn-lang-toggle');
            langBtn.innerText = t.langBtnText;
            langBtn.setAttribute('aria-label', t.langBtnAria);

            document.getElementById('main-title').innerText = t.mainTitle;
            document.getElementById('main-subtitle').innerText = t.mainSubtitle;
            document.getElementById('mode-label').innerText = t.modeLabel;
            document.getElementById('btn-bot').innerText = t.btnBot;
            document.getElementById('btn-online').innerText = t.btnOnline;
            document.getElementById('btn-rulebook').innerText = t.btnRulebook;

            document.getElementById('rulebook-title').innerText = t.rulebookTitle;
            document.getElementById('rulebook-subtitle').innerText = t.rulebookSubtitle;

            const rulebookContent = document.getElementById('rulebook-content');
            rulebookContent.setAttribute('aria-label', t.rulebookAria);
            rulebookContent.innerHTML = t.rulebookHTML;

            document.getElementById('btn-close-rulebook').innerText = t.btnCloseRulebook;
        }

        // 4. ฟังก์ชันเมื่อผู้เล่นกดปุ่มสลับภาษา
        function toggleLanguage() {
            currentLang = (currentLang === 'th') ? 'en' : 'th';
            try {
                localStorage.setItem(LANG_STORAGE_KEY, currentLang);
            } catch (e) {}
            applyLanguageUI();

            const announcer = document.getElementById('aria-announcer');
            announcer.innerText = '';
            setTimeout(() => {
                announcer.innerText = I18N[currentLang].langChangedAnnounce;
            }, 100);
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            
            const targetScreen = document.getElementById(screenId);
            targetScreen.classList.add('active');

            const targetHeading = targetScreen.querySelector('h1');
            if (targetHeading) {
                targetHeading.focus();
            }
        }

        // 5. เรียกใช้งานทันทีเมื่อโหลดหน้าเว็บเสร็จ
        window.addEventListener('DOMContentLoaded', () => {
            applyLanguageUI();
            const initialHeading = document.getElementById('main-title');
            if (initialHeading) {
                initialHeading.focus();
            }
        });
    </script>
</body>
</html>
